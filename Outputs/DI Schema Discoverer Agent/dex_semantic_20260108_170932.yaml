version: "1.0"

semantic_model:
  - name: customer_experience_analytics
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, employee management,
      and currency exchange operations. This model enables end-to-end analysis of customer journeys,
      order fulfillment, product performance, supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - CUSTOMERS: One row per customer (grain: customer_id)
        - CAMPAIGNS: One row per marketing campaign (grain: campaign_id)
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-employee assignment with temporal validity (grain: assignment_id, supports SCD Type-2)
        - EMPLOYEES: One row per employee (grain: employee_id, supports recursive hierarchy via manager_id)
        - EXCHANGE_RATES: One row per currency per date (grain: currency_code + rate_date, supports as-of lookups)
        - ORDER_ITEMS: One row per order line item (grain: order_item_id)
        - ORDERS: One row per customer order (grain: order_id)
        - PRODUCT_CATEGORIES: One row per product category (grain: category_id, supports recursive hierarchy via parent_category_id)
        - PRODUCTS: One row per product (grain: product_id)
        - SHIPMENT_ITEMS: One row per shipment line item (grain: shipment_item_id)
        - SHIPMENTS: One row per shipment (grain: shipment_id)
        - STORES: One row per store location (grain: store_id)
        - SUPPLIERS: One row per supplier (grain: supplier_id)
        
        ## Metric Selection Guidance
        
        ### Order-Level vs Order-Item-Level Revenue
        - Use ORDERS.total_amount_usd for order-level revenue analysis
        - Use ORDER_ITEMS.line_revenue_usd for product-level or order-item-level revenue analysis
        - NEVER sum ORDERS.total_amount_usd after joining ORDERS to ORDER_ITEMS (causes double counting)
        - NEVER sum ORDERS.total_cost_usd after joining ORDERS to ORDER_ITEMS (causes double counting)
        
        ### Order-Level vs Order-Item-Level Cost
        - Use ORDERS.total_cost_usd for order-level cost analysis
        - Use ORDER_ITEMS.line_cost_usd for product-level or order-item-level cost analysis
        
        ### Shipment-Level vs Shipment-Item-Level Analysis
        - Use SHIPMENTS.freight_cost_usd for shipment-level freight cost
        - Use SHIPMENT_ITEMS.quantity for product-level shipment quantity
        - NEVER sum SHIPMENTS.freight_cost_usd after joining SHIPMENTS to SHIPMENT_ITEMS (causes double counting)
        
        ## Join Guidance
        
        ### Standard Relationships
        - ORDERS.customer_id = CUSTOMERS.customer_id (many-to-one)
        - ORDERS.store_id = STORES.store_id (many-to-one)
        - ORDER_ITEMS.order_id = ORDERS.order_id (many-to-one)
        - ORDER_ITEMS.product_id = PRODUCTS.product_id (many-to-one)
        - PRODUCTS.category_id = PRODUCT_CATEGORIES.category_id (many-to-one)
        - PRODUCTS.supplier_id = SUPPLIERS.supplier_id (many-to-one)
        - SHIPMENTS.supplier_id = SUPPLIERS.supplier_id (many-to-one)
        - SHIPMENTS.store_id = STORES.store_id (many-to-one)
        - SHIPMENT_ITEMS.shipment_id = SHIPMENTS.shipment_id (many-to-one)
        - SHIPMENT_ITEMS.product_id = PRODUCTS.product_id (many-to-one)
        
        ### Recursive Hierarchies
        
        #### Employee Management Hierarchy
        - EMPLOYEES.manager_id references EMPLOYEES.employee_id
        - Use recursive CTE to traverse management chain
        - Example: Find all employees reporting to a manager (direct and indirect)
        
        #### Product Category Hierarchy
        - PRODUCT_CATEGORIES.parent_category_id references PRODUCT_CATEGORIES.category_id
        - Use recursive CTE to traverse category tree
        - Example: Find all subcategories under a parent category
        
        ### SCD Type-2 Temporal Relationship
        
        #### Customer Account Manager Assignment
        - CUSTOMER_ACCOUNT_MANAGERS tracks historical account manager assignments
        - Fields: customer_id, employee_id, valid_from, valid_to
        - valid_to = NULL indicates current assignment
        - To find account manager for a customer at a specific date:
          - Match customer_id
          - Match date >= valid_from
          - Match date < COALESCE(valid_to, '9999-12-31'::date)
        - Example: Find account manager for customer 10234 on 2024-03-10
        
        ### As-Of Relationship
        
        #### Currency Exchange Rate Lookup
        - EXCHANGE_RATES contains daily exchange rates
        - To convert order amounts to USD using the rate effective on order_date:
          - Match ORDERS.currency_code = EXCHANGE_RATES.currency_code
          - Match EXCHANGE_RATES.rate_date <= ORDERS.order_date
          - Select the most recent rate: ORDER BY EXCHANGE_RATES.rate_date DESC LIMIT 1
        - Example: Convert local_amount to USD using the exchange rate on order_date
        
        ## Time Analysis Guidance
        
        ### Order Analysis
        - Use ORDERS.order_date for order placement analysis
        - ORDERS.order_date is TIMESTAMP type, truncate to DATE for daily aggregation
        
        ### Customer Analysis
        - Use CUSTOMERS.signup_date for customer acquisition analysis
        - Use CUSTOMERS.created_at for customer record creation timestamp
        
        ### Campaign Analysis
        - Use CAMPAIGNS.start_date and CAMPAIGNS.end_date for campaign period analysis
        - Campaign effectiveness should be measured within the campaign period
        
        ### Shipment Analysis
        - Use SHIPMENTS.ship_date for shipment departure analysis
        - Use SHIPMENTS.expected_arrival for planned arrival analysis
        - Use SHIPMENTS.actual_arrival for actual arrival analysis
        - Calculate delivery delay: actual_arrival - expected_arrival
        
        ### Account Manager Assignment Analysis
        - Use CUSTOMER_ACCOUNT_MANAGERS.valid_from for assignment start analysis
        - Use CUSTOMER_ACCOUNT_MANAGERS.valid_to for assignment end analysis
        - Current assignments have valid_to = NULL
        
        ## Double-Counting Prevention
        
        ### Order-to-Order-Item Join
        - ORDERS has one row per order
        - ORDER_ITEMS has multiple rows per order
        - Joining ORDERS to ORDER_ITEMS multiplies ORDERS rows by the number of items per order
        - NEVER aggregate ORDERS.total_amount_usd or ORDERS.total_cost_usd after this join
        - Use ORDER_ITEMS.line_revenue_usd and ORDER_ITEMS.line_cost_usd for item-level analysis
        
        ### Shipment-to-Shipment-Item Join
        - SHIPMENTS has one row per shipment
        - SHIPMENT_ITEMS has multiple rows per shipment
        - Joining SHIPMENTS to SHIPMENT_ITEMS multiplies SHIPMENTS rows by the number of items per shipment
        - NEVER aggregate SHIPMENTS.freight_cost_usd after this join
        - Use SHIPMENT_ITEMS.quantity for item-level shipment quantity
        
        ### Customer-to-Order Join
        - CUSTOMERS has one row per customer
        - ORDERS has multiple rows per customer
        - Joining CUSTOMERS to ORDERS multiplies CUSTOMERS rows by the number of orders per customer
        - Customer-level attributes (signup_date, customer_segment) should not be aggregated after this join
        
        ## Query Restrictions and Ambiguity
        
        ### Currency Conversion
        - ORDERS contains both total_amount_usd (USD) and local_amount (local currency)
        - Use EXCHANGE_RATES for as-of currency conversion when analyzing local_amount
        - ORDERS.currency_code indicates the currency of local_amount
        
        ### Returned Orders
        - ORDERS.is_returned indicates whether an order was returned
        - Revenue analysis should consider whether to include or exclude returned orders
        - Filter by is_returned = false for net revenue analysis
        
        ### Order Status
        - ORDERS.order_status indicates current order status
        - Possible values include: Placed, Shipped, Delivered, Cancelled, Returned
        - Revenue recognition may depend on order status
        
        ### Shipment Status
        - SHIPMENTS.shipment_status indicates current shipment status
        - Possible values include: In Transit, Delivered, Delayed
        - Delivery performance analysis should consider shipment_status
        
        ### Computed Fields
        - ORDER_ITEMS.line_revenue_usd is computed: quantity * unit_price_usd * (1 - discount_pct / 100.0)
        - ORDER_ITEMS.line_cost_usd is computed: quantity * unit_cost_usd
        - These fields are pre-calculated and should be used directly
        
        ### Customer Rating
        - ORDERS.customer_rating is an optional field (nullable)
        - Rating scale: 1-5 (assumed based on INT2 type)
        - Use AVG() for average rating, handle NULL values appropriately
        
        ### Supplier Reliability
        - SUPPLIERS.reliability_score indicates supplier reliability (0.0 to 1.0 scale)
        - Higher score indicates more reliable supplier
        - Use for supplier performance analysis
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Stores comprehensive customer profiles including unique identifiers, contact details,
          geographic location, customer segmentation, and registration information. This dataset
          represents one row per customer and serves as the master customer dimension for
          customer relationship management and customer-centric analytics.
        source: CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer. Contains personally identifiable information (PII).
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer. Contains personally identifiable information (PII).
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer. Contains personally identifiable information (PII). Must be unique across all customers.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer. Contains personally identifiable information (PII).
            sql_type: VARCHAR(20)
            constraints: []
          
          - name: city
            business_name: City
            description: City where the customer is located. Geographic dimension for customer location analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located. Geographic dimension for customer location analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer (e.g., Regular, Premium, VIP). Business dimension for customer segmentation analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up. Time dimension for customer acquisition and cohort analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Contains marketing campaign definitions including campaign identifiers, names, marketing channels,
          target customer segments, campaign periods, and discount offerings. This dataset represents one row
          per marketing campaign and supports campaign performance and marketing effectiveness analysis.
        source: CAMPAIGNS
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign (e.g., Spring Clearance Sale).
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign (e.g., Email, Social Media, Web). Business dimension for channel analysis.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign (e.g., Loyal Customers, New Customers). Business dimension for campaign targeting analysis.
            sql_type: VARCHAR(20)
            constraints: []
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts. Time dimension for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends. Time dimension for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign. Measure for campaign discount analysis.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Stores historical customer account manager assignments with temporal validity tracking.
          This dataset implements Slowly Changing Dimension Type-2 pattern, maintaining one row per
          assignment period. Each assignment has a validity period defined by valid_from and valid_to dates.
          Current assignments have valid_to = NULL. Supports historical analysis of customer-employee
          relationships and account manager performance over time.
        source: CUSTOMER_ACCOUNT_MANAGERS
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record. Foreign key to CUSTOMERS.customer_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager. Foreign key to EMPLOYEES.employee_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective. Start of validity period for SCD Type-2 temporal tracking.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends. End of validity period for SCD Type-2 temporal tracking. NULL indicates current assignment.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
      
      - name: employees
        business_name: Employees
        description: >-
          Maintains employee records including identifiers, names, job roles, management hierarchy,
          geographic assignments, and hire dates. This dataset represents one row per employee and
          supports a recursive management hierarchy through the manager_id self-referencing foreign key.
          Enables employee performance analysis, organizational structure analysis, and management hierarchy traversal.
        source: EMPLOYEES
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee. Contains personally identifiable information (PII).
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: Job role or position of the employee (e.g., Account Manager, Sales Representative). Business dimension for role-based analysis.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee. Self-referencing foreign key to EMPLOYEES.employee_id. Supports recursive management hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee (e.g., North America, Europe). Business dimension for regional analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired. Time dimension for employee tenure and hiring trend analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Contains daily currency exchange rates against USD for multiple currencies. This dataset
          represents one row per currency per date and supports as-of currency conversion for
          multi-currency transaction analysis. Used to convert local currency amounts to USD
          based on the exchange rate effective on a specific transaction date.
        source: EXCHANGE_RATES
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate (e.g., EUR, GBP, JPY). Part of composite primary key.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies. Part of composite primary key. Time dimension for as-of exchange rate lookup.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: Usd Rate
            description: Exchange rate of the currency against USD. Measure for currency conversion calculations.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within customer orders including product references, quantities,
          unit prices, unit costs, discounts, and calculated revenue and cost amounts. This dataset
          represents one row per order line item and is the atomic grain for product-level sales analysis.
          Contains pre-calculated derived fields: line_revenue_usd (quantity * unit_price_usd * (1 - discount_pct / 100.0))
          and line_cost_usd (quantity * unit_cost_usd).
        source: ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record. Foreign key to ORDERS.order_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item. Foreign key to PRODUCTS.product_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered. Measure for quantity analysis.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price Usd
            description: Selling price per unit in USD. Measure for pricing analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost Usd
            description: Cost per unit in USD. Measure for cost analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item. Measure for discount analysis.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: line_revenue_usd
            business_name: Line Revenue Usd
            description: Calculated revenue for the order item line in USD after discounts. Computed field derived as quantity * unit_price_usd * (1 - discount_pct / 100.0). Measure for item-level revenue analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost Usd
            description: Calculated cost for the order item line in USD. Computed field derived as quantity * unit_cost_usd. Measure for item-level cost analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
      
      - name: orders
        business_name: Orders
        description: >-
          Records customer orders including order identifiers, customer references, store references,
          order timestamps, channels, payment methods, status, return indicators, customer ratings,
          currency information, and total amounts. This dataset represents one row per order and is
          the primary grain for order-level sales analysis. Contains both USD amounts (total_amount_usd,
          total_cost_usd) and local currency amounts (local_amount) with currency_code indicating the
          local currency.
        source: ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order. Foreign key to CUSTOMERS.customer_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order. Foreign key to STORES.store_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed. Time dimension for order placement and sales trend analysis.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed (e.g., Web, Mobile, In-Store). Business dimension for channel analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order (e.g., Credit Card, PayPal, Cash). Business dimension for payment method analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order (e.g., Placed, Shipped, Delivered, Cancelled, Returned). Business dimension for order status analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned. Boolean dimension for return analysis.
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience. Nullable field. Measure for customer satisfaction analysis.
            sql_type: INT2
            constraints: []
          
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts. Indicates the currency of local_amount field. Business dimension for currency analysis.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount Usd
            description: Total order amount in USD. Measure for order-level revenue analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency specified by currency_code. Measure for local currency analysis.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: total_cost_usd
            business_name: Total Cost Usd
            description: Total cost of fulfilling the order in USD. Measure for order-level cost analysis.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Contains product category definitions with hierarchical structure. This dataset represents
          one row per product category and supports a recursive category hierarchy through the
          parent_category_id self-referencing foreign key. Enables category-level product analysis
          and category hierarchy traversal for roll-up reporting.
        source: PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category (e.g., Electronics, Clothing, Home & Garden). Business dimension for category analysis.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy. Self-referencing foreign key to PRODUCT_CATEGORIES.category_id. Supports recursive category hierarchy. NULL indicates top-level category.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: products
        business_name: Products
        description: >-
          Contains product master data including product identifiers, names, category assignments,
          unit costs, unit prices, supplier references, and creation timestamps. This dataset
          represents one row per product and serves as the master product dimension for
          product-centric analytics and inventory management.
        source: PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product (e.g., Wireless Headphones, Laptop Computer).
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs. Foreign key to PRODUCT_CATEGORIES.category_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost Usd
            description: Cost to acquire or produce one unit of the product in USD. Measure for product cost analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price Usd
            description: Selling price per unit of the product in USD. Measure for product pricing analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product. Foreign key to SUPPLIERS.supplier_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Records individual line items within shipments including product references and quantities.
          This dataset represents one row per shipment line item and is the atomic grain for
          product-level shipment analysis. Enables detailed tracking of which products are included
          in each shipment and in what quantities.
        source: SHIPMENT_ITEMS
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item. Foreign key to SHIPMENTS.shipment_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item. Foreign key to PRODUCTS.product_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item. Measure for shipment quantity analysis.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: shipments
        business_name: Shipments
        description: >-
          Records shipments from suppliers to stores including shipment identifiers, supplier references,
          store references, shipment dates, expected and actual arrival dates, freight costs, and
          shipment status. This dataset represents one row per shipment and supports shipment logistics
          analysis, delivery performance tracking, and freight cost analysis.
        source: SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment. Foreign key to SUPPLIERS.supplier_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment. Foreign key to STORES.store_id.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed. Time dimension for shipment departure analysis.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment. Time dimension for planned delivery analysis.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment. Time dimension for actual delivery analysis.
            sql_type: DATE
            constraints: []
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost Usd
            description: Freight cost of the shipment in USD. Measure for shipment-level freight cost analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment (e.g., In Transit, Delivered, Delayed). Business dimension for shipment status analysis.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
      
      - name: stores
        business_name: Stores
        description: >-
          Contains store master data including store identifiers, names, geographic locations,
          store types, and creation timestamps. This dataset represents one row per store location
          and serves as the master store dimension for store-centric analytics and location-based
          performance analysis.
        source: STORES
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store (e.g., Downtown Flagship Store, Mall Location).
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: City where the store is located. Geographic dimension for store location analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located. Geographic dimension for store location analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical. Business dimension for store type analysis.
            sql_type: VARCHAR(30)
            constraints: []
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Contains supplier master data including supplier identifiers, names, countries,
          contact information, reliability scores, and creation timestamps. This dataset
          represents one row per supplier and serves as the master supplier dimension for
          supplier performance analysis and procurement analytics.
        source: SUPPLIERS
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier. Auto-incrementing serial primary key.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization (e.g., Global Electronics Inc.).
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Country
            description: Country where the supplier is based. Geographic dimension for supplier location analysis.
            sql_type: VARCHAR(80)
            constraints: []
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier. Contains personally identifiable information (PII).
            sql_type: VARCHAR(150)
            constraints: []
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier (0.0 to 1.0 scale). Higher score indicates more reliable supplier. Measure for supplier performance analysis.
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer.
          Multiple orders can belong to the same customer. Join on customer_id equality.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store.
          Multiple orders can be fulfilled by the same store. Join on store_id equality.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order.
          Multiple order items can belong to the same order. Join on order_id equality.
          IMPORTANT: When joining order_items to orders, do NOT aggregate order-level measures
          (total_amount_usd, total_cost_usd) as this will cause double counting. Use item-level
          measures (line_revenue_usd, line_cost_usd) for product-level analysis.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product.
          Multiple order items can reference the same product. Join on product_id equality.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          Multiple products can belong to the same category. Join on category_id equality.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is provided by exactly one supplier.
          Multiple products can be provided by the same supplier. Join on supplier_id equality.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier.
          Multiple shipments can originate from the same supplier. Join on supplier_id equality.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is destined for exactly one store.
          Multiple shipments can be destined for the same store. Join on store_id equality.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment.
          Multiple shipment items can belong to the same shipment. Join on shipment_id equality.
          IMPORTANT: When joining shipment_items to shipments, do NOT aggregate shipment-level
          measures (freight_cost_usd) as this will cause double counting. Use item-level measures
          (quantity) for product-level shipment analysis.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product.
          Multiple shipment items can reference the same product. Join on product_id equality.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each account manager assignment references exactly one customer.
          Multiple assignments (historical and current) can exist for the same customer due to SCD Type-2 tracking.
          Join on customer_id equality.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each account manager assignment references exactly one employee.
          Multiple assignments can reference the same employee. Join on employee_id equality.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Each employee (except top-level executives) reports to
          exactly one manager. A manager can have multiple direct reports. Join on manager_id = employee_id.
          Use recursive CTE to traverse the complete management hierarchy. Example PostgreSQL recursive query:
          WITH RECURSIVE employee_hierarchy AS (
            SELECT employee_id, employee_name, manager_id, 1 AS level
            FROM employees
            WHERE manager_id IS NULL
            UNION ALL
            SELECT e.employee_id, e.employee_name, e.manager_id, eh.level + 1
            FROM employees e
            INNER JOIN employee_hierarchy eh ON e.manager_id = eh.employee_id
          )
          SELECT * FROM employee_hierarchy;
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Each category (except top-level categories) has exactly
          one parent category. A parent category can have multiple child categories. Join on
          parent_category_id = category_id. Use recursive CTE to traverse the complete category hierarchy.
          Example PostgreSQL recursive query:
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 1 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT pc.category_id, pc.category_name, pc.parent_category_id, ch.level + 1
            FROM product_categories pc
            INNER JOIN category_hierarchy ch ON pc.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. To find the account manager assigned to a customer at the time
          an order was placed, match on customer_id and apply date range logic. The order_date must fall
          within the validity period of the assignment. Join condition:
          orders.customer_id = customer_account_managers.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND orders.order_date::date < COALESCE(customer_account_managers.valid_to, '9999-12-31'::date)
          This returns the account manager who was assigned to the customer on the order date.
          For current assignments, valid_to is NULL.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: asof
        resolution: >-
          As-of temporal relationship. To convert order local_amount to USD using the exchange rate
          effective on the order date, match on currency_code and apply as-of date logic. The exchange
          rate used should be the most recent rate on or before the order date. Join condition:
          orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date <= orders.order_date::date
          ORDER BY exchange_rates.rate_date DESC
          LIMIT 1
          This returns the exchange rate effective on the order date. For orders in USD (currency_code = 'USD'),
          no conversion is needed as total_amount_usd is already in USD.
    
    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total revenue from all orders in USD. Aggregates order-level total_amount_usd.
          This metric should be used for order-level revenue analysis. Do not use this metric
          after joining orders to order_items as it will cause double counting.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total cost of fulfilling all orders in USD. Aggregates order-level total_cost_usd.
          This metric should be used for order-level cost analysis. Do not use this metric
          after joining orders to order_items as it will cause double counting.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Gross profit from all orders in USD, calculated as total revenue minus total cost.
          Uses order-level amounts. Do not use this metric after joining orders to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (total revenue - total cost) / total revenue * 100.
          Uses order-level amounts. Handles division by zero by returning 0 when revenue is zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) / SUM(orders.total_amount_usd) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Counts distinct order_id from orders dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Counts distinct customer_id from customers dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value in USD, calculated as total revenue divided by number of orders.
          Handles division by zero by returning NULL when order count is zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN NULL
                        ELSE SUM(orders.total_amount_usd) / COUNT(orders.order_id)
                    END AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer, calculated as total order count divided by
          total customer count. Handles division by zero by returning NULL when customer count is zero.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN NULL
                        ELSE COUNT(orders.order_id)::decimal / COUNT(DISTINCT orders.customer_id)
                    END AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer in USD, calculated as total revenue divided by number
          of unique customers who placed orders. Handles division by zero by returning NULL
          when customer count is zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN NULL
                        ELSE SUM(orders.total_amount_usd) / COUNT(DISTINCT orders.customer_id)
                    END AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: item_level_revenue_usd
        business_name: Item Level Revenue USD
        description: >-
          Total revenue from all order items in USD. Aggregates item-level line_revenue_usd.
          This metric should be used for product-level or order-item-level revenue analysis.
          Use this metric when analyzing revenue by product, category, or when joining to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS item_level_revenue_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
      
      - name: item_level_cost_usd
        business_name: Item Level Cost USD
        description: >-
          Total cost from all order items in USD. Aggregates item-level line_cost_usd.
          This metric should be used for product-level or order-item-level cost analysis.
          Use this metric when analyzing cost by product, category, or when joining to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS item_level_cost_usd
                FROM order_items
              columns_used:
                - order_items.line_cost_usd
      
      - name: item_level_profit_usd
        business_name: Item Level Profit USD
        description: >-
          Total profit from all order items in USD, calculated as item-level revenue minus
          item-level cost. Use this metric for product-level or order-item-level profit analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS item_level_profit_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items. Aggregates quantity
          from order_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_selling_price_usd
        business_name: Average Selling Price USD
        description: >-
          Average selling price per unit in USD, calculated as total item-level revenue divided
          by total units sold. This is a weighted average that accounts for quantity and discounts.
          Handles division by zero by returning NULL when units sold is zero.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.quantity) = 0 THEN NULL
                        ELSE SUM(order_items.line_revenue_usd) / SUM(order_items.quantity)
                    END AS average_selling_price_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.quantity
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items, weighted by line revenue.
          Calculated as total discount amount divided by total revenue before discount.
          Handles division by zero by returning 0 when revenue before discount is zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.quantity * order_items.unit_price_usd) = 0 THEN 0
                        ELSE (SUM(order_items.quantity * order_items.unit_price_usd) - SUM(order_items.line_revenue_usd)) 
                             / SUM(order_items.quantity * order_items.unit_price_usd) * 100
                    END AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.line_revenue_usd
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost from all shipments in USD. Aggregates shipment-level freight_cost_usd.
          This metric should be used for shipment-level freight cost analysis. Do not use this metric
          after joining shipments to shipment_items as it will cause double counting.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Counts distinct shipment_id from shipments dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped across all shipment items. Aggregates quantity
          from shipment_items dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average delivery delay in days, calculated as the difference between actual arrival
          and expected arrival dates. Positive values indicate late delivery, negative values
          indicate early delivery. Only includes shipments with both actual and expected arrival dates.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.expected_arrival IS NOT NULL
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments delivered on or before expected arrival date. Calculated as
          count of on-time shipments divided by total shipments with arrival dates. Handles
          division by zero by returning NULL when no shipments have arrival dates.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL AND shipments.expected_arrival IS NOT NULL THEN 1 END) = 0 THEN NULL
                        ELSE COUNT(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 END)::decimal 
                             / COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL AND shipments.expected_arrival IS NOT NULL THEN 1 END) * 100
                    END AS on_time_delivery_pct
                FROM shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders with ratings. Customer rating is optional
          (nullable field). Only includes orders where customer_rating is not NULL.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned. Calculated as count of returned orders
          divided by total order count. Handles division by zero by returning 0 when order count is zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(orders.order_id) = 0 THEN 0
                        ELSE COUNT(CASE WHEN orders.is_returned = true THEN 1 END)::decimal / COUNT(orders.order_id) * 100
                    END AS return_rate_pct
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products. Counts distinct product_id from products dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of unique suppliers. Counts distinct supplier_id from suppliers dataset.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(suppliers.supplier_id) AS supplier_count
                FROM suppliers
              columns_used:
                - suppliers.supplier_id
      
      - name: average_supplier_reliability_score
        business_name: Average Supplier Reliability Score
        description: >-
          Average reliability score across all suppliers. Reliability score ranges from 0.0 to 1.0,
          with higher scores indicating more reliable suppliers.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS average_supplier_reliability_score
                FROM suppliers
              columns_used:
                - suppliers.reliability_score
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue in USD aggregated by month. Groups orders by month extracted from order_date
          and sums total_amount_usd. Returns one row per month with revenue for that month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: revenue_by_customer_segment
        business_name: Revenue By Customer Segment
        description: >-
          Total revenue in USD aggregated by customer segment. Joins orders to customers and
          groups by customer_segment. Returns one row per customer segment with revenue for that segment.
        return_type: currency_usd
        result_grain: one row per customer segment
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_segment,
                    SUM(orders.total_amount_usd) AS revenue_by_segment_usd
                FROM orders
                INNER JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_segment
                ORDER BY revenue_by_segment_usd DESC
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - customers.customer_id
                - customers.customer_segment
      
      - name: revenue_by_product_category
        business_name: Revenue By Product Category
        description: >-
          Total revenue in USD aggregated by product category. Joins order_items to products to
          product_categories and groups by category_name. Uses item-level line_revenue_usd.
          Returns one row per product category with revenue for that category.
        return_type: currency_usd
        result_grain: one row per product category
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    product_categories.category_name,
                    SUM(order_items.line_revenue_usd) AS revenue_by_category_usd
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                INNER JOIN product_categories ON products.category_id = product_categories.category_id
                GROUP BY product_categories.category_name
                ORDER BY revenue_by_category_usd DESC
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.category_id
                - product_categories.category_id
                - product_categories.category_name
      
      - name: revenue_by_order_channel
        business_name: Revenue By Order Channel
        description: >-
          Total revenue in USD aggregated by order channel. Groups orders by order_channel and
          sums total_amount_usd. Returns one row per order channel with revenue for that channel.
        return_type: currency_usd
        result_grain: one row per order channel
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_channel,
                    SUM(orders.total_amount_usd) AS revenue_by_channel_usd
                FROM orders
                GROUP BY orders.order_channel
                ORDER BY revenue_by_channel_usd DESC
              columns_used:
                - orders.order_channel
                - orders.total_amount_usd
      
      - name: top_products_by_revenue
        business_name: Top Products By Revenue
        description: >-
          Products ranked by total revenue in USD. Joins order_items to products and groups by
          product_id and product_name. Uses item-level line_revenue_usd. Returns one row per
          product with revenue and rank.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    products.product_id,
                    products.product_name,
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd,
                    RANK() OVER (ORDER BY SUM(order_items.line_revenue_usd) DESC) AS revenue_rank
                FROM order_items
                INNER JOIN products ON order_items.product_id = products.product_id
                GROUP BY products.product_id, products.product_name
                ORDER BY product_revenue_usd DESC
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - products.product_id
                - products.product_name
      
      - name: top_customers_by_revenue
        business_name: Top Customers By Revenue
        description: >-
          Customers ranked by total revenue in USD. Joins orders to customers and groups by
          customer_id, first_name, and last_name. Returns one row per customer with revenue and rank.
        return_type: currency_usd
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    customers.customer_id,
                    customers.first_name,
                    customers.last_name,
                    SUM(orders.total_amount_usd) AS customer_revenue_usd,
                    RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS revenue_rank
                FROM orders
                INNER JOIN customers ON orders.customer_id = customers.customer_id
                GROUP BY customers.customer_id, customers.first_name, customers.last_name
                ORDER BY customer_revenue_usd DESC
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
                - customers.customer_id
                - customers.first_name
                - customers.last_name
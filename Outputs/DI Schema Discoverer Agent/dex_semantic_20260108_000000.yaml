version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, and employee management.
      This model supports end-to-end analytical queries across customer journeys, order fulfillment,
      product performance, supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Reference
        
        - **customers**: One row per customer. Contains customer profile and contact information.
        - **orders**: One row per order. Contains order-level totals and metadata.
        - **order_items**: One row per order line item (product within an order). Multiple rows per order.
        - **products**: One row per product in the catalog.
        - **product_categories**: One row per product category. Supports hierarchical category structure.
        - **stores**: One row per store location.
        - **suppliers**: One row per supplier organization.
        - **shipments**: One row per shipment from supplier to store.
        - **shipment_items**: One row per product within a shipment. Multiple rows per shipment.
        - **employees**: One row per employee. Supports recursive manager hierarchy.
        - **customer_account_managers**: One row per customer-account manager assignment with temporal validity (SCD Type-2).
        - **campaigns**: One row per marketing campaign.
        - **exchange_rates**: One row per currency per date. Used for as-of currency conversion.
        
        ## Critical Grain Warnings - Avoid Double Counting
        
        **Order-Level vs Order-Item-Level Revenue:**
        - Use `orders.total_amount_usd` for order-level revenue analysis (e.g., revenue by customer, by store, by date).
        - Use `order_items.line_revenue_usd` for product-level or order-item-level revenue analysis.
        - **NEVER** sum `orders.total_amount_usd` after joining orders to order_items. This will duplicate order totals.
        - When analyzing revenue by product, always use `order_items.line_revenue_usd`.
        
        **Order-Level vs Order-Item-Level Cost:**
        - Use `orders.total_cost_usd` for order-level cost analysis.
        - Use `order_items.line_cost_usd` for product-level or order-item-level cost analysis.
        - **NEVER** sum `orders.total_cost_usd` after joining orders to order_items.
        
        **Shipment-Level vs Shipment-Item-Level:**
        - Use `shipments.freight_cost_usd` for shipment-level freight cost analysis.
        - **NEVER** sum `shipments.freight_cost_usd` after joining shipments to shipment_items.
        - When analyzing shipment quantities by product, use `shipment_items.quantity`.
        
        ## Relationship and Join Guidance
        
        **Standard Relationships:**
        - customers → orders (one-to-many via customer_id)
        - orders → order_items (one-to-many via order_id)
        - order_items → products (many-to-one via product_id)
        - products → product_categories (many-to-one via category_id)
        - products → suppliers (many-to-one via supplier_id)
        - orders → stores (many-to-one via store_id)
        - shipments → suppliers (many-to-one via supplier_id)
        - shipments → stores (many-to-one via store_id)
        - shipments → shipment_items (one-to-many via shipment_id)
        - shipment_items → products (many-to-one via product_id)
        - campaigns can be analyzed independently or joined to orders via customer segment and date range logic.
        
        **Recursive Hierarchy - Employee Management:**
        - employees.manager_id references employees.employee_id
        - This creates a recursive management hierarchy.
        - Use recursive CTEs to traverse the full hierarchy when calculating team size, reporting chains, or organizational depth.
        - Example: To find all employees reporting to a manager (directly or indirectly), use a recursive query starting from the manager.
        
        **Hierarchical Relationship - Product Categories:**
        - product_categories.parent_category_id references product_categories.category_id
        - This creates a hierarchical category structure (e.g., Electronics → Computers → Laptops).
        - Use recursive CTEs to traverse the category hierarchy when rolling up product metrics by parent categories.
        
        **SCD Type-2 Relationship - Customer Account Managers:**
        - customer_account_managers tracks historical assignments of account managers to customers.
        - Multiple records can exist for the same customer_id with different validity periods.
        - Fields: customer_id, employee_id, valid_from, valid_to
        - To find the account manager for a customer at a specific date (e.g., order_date):
          - Join on customer_id
          - Filter: order_date >= valid_from AND order_date < COALESCE(valid_to, '9999-12-31'::date)
        - When valid_to is NULL, the assignment is currently active.
        - **NEVER** use a simple equality join on customer_id alone. Always include the date range condition.
        
        **As-Of Relationship - Exchange Rates:**
        - exchange_rates contains daily exchange rates for currencies against USD.
        - To convert an order amount to USD using the exchange rate effective on the order date:
          - Join on currency_code
          - Filter: rate_date <= order_date::date
          - Order by rate_date DESC and take the most recent rate (LIMIT 1 or use window functions)
        - This is an as-of join, not a simple equality join.
        - Example: orders.local_amount / exchange_rates.usd_rate where exchange_rates.rate_date is the most recent date <= orders.order_date
        
        ## Time Analysis Guidance
        
        **Primary Date Fields:**
        - **orders.order_date**: Use for sales and revenue time-series analysis, order trends, and period-over-period comparisons.
        - **customers.signup_date**: Use for customer acquisition analysis and cohort analysis.
        - **shipments.ship_date**: Use for shipment timing and logistics analysis.
        - **shipments.expected_arrival / actual_arrival**: Use for delivery performance and delay analysis.
        - **campaigns.start_date / end_date**: Use for campaign timing and effectiveness analysis.
        - **employees.hire_date**: Use for employee tenure and hiring trend analysis.
        
        **Date Selection for Metrics:**
        - Revenue metrics: Use orders.order_date
        - Customer acquisition metrics: Use customers.signup_date
        - Shipment metrics: Use shipments.ship_date or actual_arrival
        - Campaign metrics: Use campaigns.start_date or filter orders within campaign date range
        
        ## Metric Interpretation
        
        **Revenue and Cost Metrics:**
        - Total Revenue: Sum of orders.total_amount_usd (order-level) or order_items.line_revenue_usd (item-level)
        - Total Cost: Sum of orders.total_cost_usd (order-level) or order_items.line_cost_usd (item-level)
        - Gross Profit: Revenue - Cost
        - Gross Margin %: (Revenue - Cost) / Revenue * 100
        
        **Order Metrics:**
        - Order Count: COUNT(DISTINCT orders.order_id)
        - Average Order Value: SUM(orders.total_amount_usd) / COUNT(DISTINCT orders.order_id)
        - Items per Order: COUNT(order_items.order_item_id) / COUNT(DISTINCT orders.order_id)
        
        **Customer Metrics:**
        - Customer Count: COUNT(DISTINCT customers.customer_id)
        - Orders per Customer: COUNT(DISTINCT orders.order_id) / COUNT(DISTINCT customers.customer_id)
        - Revenue per Customer: SUM(orders.total_amount_usd) / COUNT(DISTINCT customers.customer_id)
        
        **Product Metrics:**
        - Units Sold: SUM(order_items.quantity)
        - Product Revenue: SUM(order_items.line_revenue_usd)
        - Average Selling Price: SUM(order_items.line_revenue_usd) / SUM(order_items.quantity)
        
        **Shipment Metrics:**
        - Shipment Count: COUNT(DISTINCT shipments.shipment_id)
        - Total Freight Cost: SUM(shipments.freight_cost_usd)
        - Delayed Shipments: COUNT where actual_arrival > expected_arrival
        - On-Time Delivery %: (Shipments where actual_arrival <= expected_arrival) / Total Shipments * 100
        
        **Campaign Metrics:**
        - Campaign Count: COUNT(DISTINCT campaigns.campaign_id)
        - Average Discount: AVG(campaigns.discount_pct) or weighted average based on orders
        
        ## Query Restrictions and Ambiguities
        
        - When joining orders to order_items, always aggregate at the appropriate grain to avoid double counting.
        - When analyzing historical customer-account manager assignments, always use the SCD Type-2 date range logic.
        - When converting currency amounts, always use the as-of exchange rate logic.
        - Product category hierarchies require recursive queries for full rollup.
        - Employee management hierarchies require recursive queries for full organizational analysis.
        - Return analysis requires filtering orders where is_returned = true.
        - Campaign effectiveness analysis requires correlating campaign dates with order dates and customer segments.

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Contains comprehensive customer profiles including contact information, location, segment classification,
          and signup history. Grain: One row per customer. Primary entity for customer relationship management
          and customer-centric analytics.
        source: customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer.
            sql_type: VARCHAR(20)
          
          - name: city
            business_name: City
            description: City where the customer is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Records customer orders including order-level totals, payment information, channel, status, and ratings.
          Grain: One row per order. Central fact table for sales and revenue analysis at the order level.
          Contains order-level aggregated amounts that should not be summed after joining to order_items.
        source: orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience.
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD. Order-level measure. Do not sum after joining to order_items.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost of fulfilling the order in USD. Order-level measure. Do not sum after joining to order_items.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: order_items
        business_name: Order Items
        description: >-
          Records individual line items within orders, including product references, quantities, pricing, discounts,
          and calculated line-level revenue and cost. Grain: One row per order line item (product within an order).
          Multiple rows exist per order. Use for product-level and order-item-level analysis.
        source: order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: >-
              Calculated revenue for the order item line in USD after discounts.
              Computed as: quantity * unit_price_usd * (1 - discount_pct / 100.0)
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: >-
              Calculated cost for the order item line in USD.
              Computed as: quantity * unit_cost_usd
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Contains product catalog information including product names, category assignments, supplier references,
          pricing, and costing. Grain: One row per product. Central dimension for product-related analytics.
        source: products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Defines product categories with hierarchical structure support via parent category references.
          Grain: One row per product category. Supports recursive category hierarchies for rollup analysis.
        source: product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: stores
        business_name: Stores
        description: >-
          Contains store location and type information. Grain: One row per store.
          Dimension for store-based sales and fulfillment analysis.
        source: stores
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: city
            business_name: City
            description: City where the store is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical.
            sql_type: VARCHAR(30)
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Contains supplier organization information including contact details and reliability scoring.
          Grain: One row per supplier. Dimension for supplier performance and sourcing analysis.
        source: suppliers
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the supplier is based.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier.
            sql_type: VARCHAR(150)
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier.
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Records shipments from suppliers to stores including timing, freight costs, and delivery status.
          Grain: One row per shipment. Fact table for logistics and delivery performance analysis.
          Contains shipment-level freight costs that should not be summed after joining to shipment_items.
        source: shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD. Shipment-level measure. Do not sum after joining to shipment_items.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment.
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Records individual products within shipments including quantities.
          Grain: One row per product within a shipment. Multiple rows exist per shipment.
          Use for product-level shipment quantity analysis.
        source: shipment_items
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: employees
        business_name: Employees
        description: >-
          Maintains employee records including roles, regional assignments, and manager references.
          Grain: One row per employee. Supports recursive manager hierarchy for organizational analysis.
          The manager_id field creates a self-referencing relationship for management structure traversal.
        source: employees
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: Job role or position of the employee.
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee. Creates recursive hierarchy.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Tracks historical assignments of account managers to customers with temporal validity periods.
          Grain: One row per customer-account manager assignment with validity period.
          Implements SCD Type-2 pattern with valid_from and valid_to dates.
          Multiple records can exist for the same customer representing different time periods.
        source: customer_account_managers
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager.
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends. NULL indicates currently active assignment.
            sql_type: DATE
            dimension:
              is_time: true
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Contains marketing campaign definitions including target segments, channels, timing, and discount offers.
          Grain: One row per marketing campaign. Used for campaign effectiveness and promotional analysis.
        source: campaigns
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign.
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign.
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign.
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign.
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Contains daily exchange rates for currencies against USD.
          Grain: One row per currency per date. Used for as-of currency conversion in order analysis.
          Supports temporal lookups to find the most recent exchange rate effective on a given date.
        source: exchange_rates
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD.
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer.
          A customer can place multiple orders. Join on customer_id equality.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store.
          A store can fulfill multiple orders. Join on store_id equality.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order.
          An order can contain multiple order items. Join on order_id equality.
          WARNING: Do not sum orders.total_amount_usd or orders.total_cost_usd after this join
          as it will duplicate order-level totals across multiple order items.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product.
          A product can appear in multiple order items. Join on product_id equality.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          A category can contain multiple products. Join on category_id equality.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is supplied by exactly one supplier.
          A supplier can supply multiple products. Join on supplier_id equality.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier.
          A supplier can send multiple shipments. Join on supplier_id equality.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is destined for exactly one store.
          A store can receive multiple shipments. Join on store_id equality.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment.
          A shipment can contain multiple shipment items. Join on shipment_id equality.
          WARNING: Do not sum shipments.freight_cost_usd after this join as it will duplicate
          shipment-level freight costs across multiple shipment items.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product.
          A product can appear in multiple shipment items. Join on product_id equality.
      
      - name: employees_recursive_manager
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Each employee (except top-level executives) reports to
          exactly one manager who is also an employee. A manager can have multiple direct reports.
          Join on employees.manager_id = manager.employee_id.
          Use recursive CTEs to traverse the full management hierarchy for organizational depth analysis,
          team size calculations, or reporting chain queries.
      
      - name: product_categories_recursive_parent
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship. Each category (except top-level categories) has
          exactly one parent category. A parent category can have multiple child categories.
          Join on product_categories.parent_category_id = parent.category_id.
          Use recursive CTEs to traverse the full category hierarchy for rollup analysis or
          hierarchical category reporting.
      
      - name: customer_account_managers_to_customers_scd
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from assignment to customer.
          Each assignment references exactly one customer. A customer can have multiple assignments
          across different time periods (SCD Type-2). Join on customer_id equality.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship from assignment to employee (account manager).
          Each assignment references exactly one employee. An employee can have multiple assignments
          to different customers. Join on employee_id equality.
      
      - name: orders_to_customer_account_managers_scd_type2
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. To find the account manager assigned to a customer
          at the time an order was placed, join on customer_id and apply date range logic:
          orders.customer_id = customer_account_managers.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND orders.order_date::date < COALESCE(customer_account_managers.valid_to, '9999-12-31'::date)
          When valid_to is NULL, the assignment is currently active (use a far-future date for comparison).
          This ensures each order is matched to the correct account manager based on the order date.
          Do NOT use a simple equality join on customer_id alone.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: asof
        resolution: >-
          As-of temporal relationship for currency conversion. To find the exchange rate effective
          for an order, join on currency_code and use as-of date logic:
          orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date <= orders.order_date::date
          Then select the most recent rate by ordering by rate_date DESC and taking the first match
          (LIMIT 1 or use window functions with ROW_NUMBER() OVER (PARTITION BY currency_code ORDER BY rate_date DESC)).
          This ensures each order uses the most recent exchange rate available on or before the order date.
          Do NOT use a simple equality join on currency_code and date.

    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total revenue from all orders in USD. Aggregates order-level total amounts.
          Use for overall revenue analysis, revenue by customer, revenue by store, revenue by time period.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total cost of fulfilling all orders in USD. Aggregates order-level total costs.
          Use for overall cost analysis, cost by customer, cost by store, cost by time period.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Gross profit calculated as total revenue minus total cost in USD.
          Represents the profit before operating expenses.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (Revenue - Cost) / Revenue * 100.
          Represents the percentage of revenue retained as gross profit.
          Handles division by zero by returning 0 when revenue is zero.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) 
                             / SUM(orders.total_amount_usd) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of distinct orders. Use for order volume analysis and order trends.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of distinct customers. Use for customer base size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value calculated as total revenue divided by number of orders.
          Represents the typical order size in USD.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount_usd) / COUNT(DISTINCT orders.order_id)
                    END AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: revenue_per_customer_usd
        business_name: Revenue per Customer USD
        description: >-
          Average revenue per customer calculated as total revenue divided by number of distinct customers
          who have placed orders. Represents customer lifetime value proxy.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE SUM(orders.total_amount_usd) / COUNT(DISTINCT orders.customer_id)
                    END AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer calculated as total orders divided by number of distinct
          customers who have placed orders. Represents customer purchase frequency.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.customer_id) = 0 THEN 0
                        ELSE COUNT(DISTINCT orders.order_id)::DECIMAL / COUNT(DISTINCT orders.customer_id)
                    END AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: product_revenue_usd
        business_name: Product Revenue USD
        description: >-
          Total revenue by product calculated from order item line revenues.
          Use for product-level revenue analysis. This is item-level revenue, not order-level.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: product_cost_usd
        business_name: Product Cost USD
        description: >-
          Total cost by product calculated from order item line costs.
          Use for product-level cost analysis. This is item-level cost, not order-level.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_cost_usd) AS product_cost_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_cost_usd
      
      - name: product_profit_usd
        business_name: Product Profit USD
        description: >-
          Gross profit by product calculated as product revenue minus product cost.
          Use for product profitability analysis.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_profit_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items.
          Use for sales volume analysis by product.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_selling_price_usd
        business_name: Average Selling Price USD
        description: >-
          Average selling price per unit calculated as total line revenue divided by total quantity sold.
          Represents the weighted average price across all products and discounts.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.quantity) = 0 THEN 0
                        ELSE SUM(order_items.line_revenue_usd) / SUM(order_items.quantity)
                    END AS average_selling_price_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
                - order_items.quantity
      
      - name: total_discount_amount_usd
        business_name: Total Discount Amount USD
        description: >-
          Total discount amount in USD calculated as the difference between undiscounted revenue
          and actual line revenue. Represents the total value of discounts given.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity * order_items.unit_price_usd) 
                    - SUM(order_items.line_revenue_usd) AS total_discount_amount_usd
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.line_revenue_usd
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Weighted average discount percentage across all order items.
          Calculated as total discount amount divided by undiscounted revenue.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(order_items.quantity * order_items.unit_price_usd) = 0 THEN 0
                        ELSE (SUM(order_items.quantity * order_items.unit_price_usd) 
                              - SUM(order_items.line_revenue_usd)) 
                             / SUM(order_items.quantity * order_items.unit_price_usd) * 100
                    END AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.quantity
                - order_items.unit_price_usd
                - order_items.line_revenue_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of distinct shipments. Use for shipment volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost across all shipments in USD.
          Use for logistics cost analysis. This is shipment-level cost.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped across all shipment items.
          Use for shipment volume analysis by product.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Number of shipments where actual arrival date is later than expected arrival date.
          Use for delivery performance analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT shipments.shipment_id) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments delivered on time or early (actual arrival <= expected arrival).
          Represents delivery performance reliability.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT shipments.shipment_id) = 0 THEN 0
                        ELSE COUNT(DISTINCT CASE 
                                     WHEN shipments.actual_arrival <= shipments.expected_arrival 
                                     THEN shipments.shipment_id 
                                   END)::DECIMAL 
                             / COUNT(DISTINCT shipments.shipment_id) * 100
                    END AS on_time_delivery_pct
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average number of days by which shipments are delayed (actual arrival - expected arrival).
          Only includes delayed shipments. Use for delivery performance analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: returned_order_count
        business_name: Returned Order Count
        description: >-
          Number of orders that have been returned. Use for return rate analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS returned_order_count
                FROM orders
                WHERE orders.is_returned = true
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned out of total orders.
          Represents customer satisfaction and product quality indicator.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN COUNT(DISTINCT orders.order_id) = 0 THEN 0
                        ELSE COUNT(DISTINCT CASE 
                                     WHEN orders.is_returned = true 
                                     THEN orders.order_id 
                                   END)::DECIMAL 
                             / COUNT(DISTINCT orders.order_id) * 100
                    END AS return_rate_pct
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders with ratings.
          Represents overall customer satisfaction score.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: campaign_count
        business_name: Campaign Count
        description: >-
          Total number of distinct marketing campaigns. Use for campaign volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT campaigns.campaign_id) AS campaign_count
                FROM campaigns
              columns_used:
                - campaigns.campaign_id
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue aggregated by month based on order date.
          Use for monthly revenue trend analysis and time-series reporting.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Number of orders aggregated by month based on order date.
          Use for monthly order volume trend analysis.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    COUNT(DISTINCT orders.order_id) AS monthly_order_count
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_growth_mom_pct
        business_name: Revenue Growth Month-over-Month Percentage
        description: >-
          Month-over-month revenue growth percentage calculated using LAG window function.
          Represents the percentage change in revenue compared to the previous month.
        return_type: percentage
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                    SELECT
                        DATE_TRUNC('month', orders.order_date) AS order_month,
                        SUM(orders.total_amount_usd) AS revenue
                    FROM orders
                    GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                    order_month,
                    CASE
                        WHEN LAG(revenue) OVER (ORDER BY order_month) = 0 THEN 0
                        WHEN LAG(revenue) OVER (ORDER BY order_month) IS NULL THEN NULL
                        ELSE (revenue - LAG(revenue) OVER (ORDER BY order_month)) 
                             / LAG(revenue) OVER (ORDER BY order_month) * 100
                    END AS revenue_growth_mom_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: running_total_revenue_usd
        business_name: Running Total Revenue USD
        description: >-
          Cumulative running total of revenue over time ordered by order date.
          Use for cumulative revenue analysis and revenue accumulation tracking.
        return_type: currency_usd
        result_grain: one row per order date
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_date::date AS order_date,
                    SUM(SUM(orders.total_amount_usd)) OVER (ORDER BY orders.order_date::date) AS running_total_revenue_usd
                FROM orders
                GROUP BY orders.order_date::date
                ORDER BY order_date
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Ranking of customers by total revenue using DENSE_RANK.
          Rank 1 represents the highest revenue customer. Use for top customer identification.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.customer_id,
                    DENSE_RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS customer_revenue_rank
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
      
      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Ranking of products by total revenue using DENSE_RANK.
          Rank 1 represents the highest revenue product. Use for top product identification.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    DENSE_RANK() OVER (ORDER BY SUM(order_items.line_revenue_usd) DESC) AS product_revenue_rank
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd

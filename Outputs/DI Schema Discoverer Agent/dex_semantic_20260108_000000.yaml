version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, and employee management.
      This model supports end-to-end analytical queries across customer journeys, order fulfillment,
      product performance, supplier reliability, and campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer (grain: customer_id)
        - ORDERS: One row per order (grain: order_id)
        - ORDER_ITEMS: One row per order line item (grain: order_item_id)
        - PRODUCTS: One row per product (grain: product_id)
        - PRODUCT_CATEGORIES: One row per product category (grain: category_id)
        - STORES: One row per store (grain: store_id)
        - SUPPLIERS: One row per supplier (grain: supplier_id)
        - SHIPMENTS: One row per shipment (grain: shipment_id)
        - SHIPMENT_ITEMS: One row per shipment line item (grain: shipment_item_id)
        - CAMPAIGNS: One row per marketing campaign (grain: campaign_id)
        - EMPLOYEES: One row per employee (grain: employee_id)
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-account manager assignment with temporal validity (grain: assignment_id)
        - EXCHANGE_RATES: One row per currency per date (grain: currency_code + rate_date)
        
        ## Critical Double-Counting Prevention
        
        ### Order-Level vs Order-Item-Level Revenue
        - Use ORDERS.total_amount_usd for order-level revenue analysis
        - Use ORDER_ITEMS.line_revenue_usd for product-level or order-item-level revenue analysis
        - NEVER sum ORDERS.total_amount_usd after joining ORDERS to ORDER_ITEMS (this will duplicate order totals)
        - When analyzing revenue by product, use ORDER_ITEMS.line_revenue_usd
        - When analyzing revenue by customer or order channel, use ORDERS.total_amount_usd
        
        ### Order-Level vs Order-Item-Level Cost
        - Use ORDERS.total_cost_usd for order-level cost analysis
        - Use ORDER_ITEMS.line_cost_usd for product-level or order-item-level cost analysis
        - NEVER sum ORDERS.total_cost_usd after joining ORDERS to ORDER_ITEMS
        
        ### Shipment-Level Freight Cost
        - Use SHIPMENTS.freight_cost_usd at shipment grain only
        - Do not sum SHIPMENTS.freight_cost_usd after joining to SHIPMENT_ITEMS
        
        ## Relationship and Join Guidance
        
        ### Standard Relationships
        - ORDERS.customer_id → CUSTOMERS.customer_id (many-to-one)
        - ORDERS.store_id → STORES.store_id (many-to-one)
        - ORDER_ITEMS.order_id → ORDERS.order_id (many-to-one)
        - ORDER_ITEMS.product_id → PRODUCTS.product_id (many-to-one)
        - PRODUCTS.category_id → PRODUCT_CATEGORIES.category_id (many-to-one)
        - PRODUCTS.supplier_id → SUPPLIERS.supplier_id (many-to-one)
        - SHIPMENTS.supplier_id → SUPPLIERS.supplier_id (many-to-one)
        - SHIPMENTS.store_id → STORES.store_id (many-to-one)
        - SHIPMENT_ITEMS.shipment_id → SHIPMENTS.shipment_id (many-to-one)
        - SHIPMENT_ITEMS.product_id → PRODUCTS.product_id (many-to-one)
        
        ### Recursive Relationship
        - EMPLOYEES.manager_id → EMPLOYEES.employee_id (self-referencing hierarchy)
        - Use recursive CTEs to traverse the management hierarchy
        - This enables analysis of organizational structure, reporting chains, and team composition
        
        ### Hierarchical Relationship
        - PRODUCT_CATEGORIES.parent_category_id → PRODUCT_CATEGORIES.category_id (self-referencing hierarchy)
        - Use recursive CTEs to traverse the category hierarchy
        - This enables roll-up analysis from subcategories to parent categories
        
        ### SCD Type-2 Temporal Relationship
        - CUSTOMER_ACCOUNT_MANAGERS represents a Slowly Changing Dimension Type-2 pattern
        - Each customer may have multiple account manager assignments over time
        - Join ORDERS to CUSTOMER_ACCOUNT_MANAGERS using:
          - ORDERS.customer_id = CUSTOMER_ACCOUNT_MANAGERS.customer_id
          - ORDERS.order_date::date >= CUSTOMER_ACCOUNT_MANAGERS.valid_from
          - ORDERS.order_date::date < COALESCE(CUSTOMER_ACCOUNT_MANAGERS.valid_to, '9999-12-31'::date)
        - This returns the account manager who was assigned to the customer at the time of the order
        - NULL valid_to indicates the current assignment
        
        ### As-Of Relationship (Exchange Rates)
        - EXCHANGE_RATES provides currency conversion rates as of specific dates
        - Join ORDERS to EXCHANGE_RATES using:
          - ORDERS.currency_code = EXCHANGE_RATES.currency_code
          - EXCHANGE_RATES.rate_date <= ORDERS.order_date::date
          - ORDER BY EXCHANGE_RATES.rate_date DESC LIMIT 1 (to get the most recent rate as of order date)
        - This returns the exchange rate that was effective at the time of the order
        
        ## Time Analysis Guidance
        
        ### Order Analysis
        - Use ORDERS.order_date for order placement timing analysis
        - Use ORDERS.order_date to analyze order trends, seasonality, and time-based patterns
        
        ### Shipment Analysis
        - Use SHIPMENTS.ship_date for shipment departure timing
        - Use SHIPMENTS.expected_arrival for planned delivery analysis
        - Use SHIPMENTS.actual_arrival for actual delivery analysis
        - Calculate delivery delay as: actual_arrival - expected_arrival
        
        ### Campaign Analysis
        - Use CAMPAIGNS.start_date and CAMPAIGNS.end_date for campaign period analysis
        - Determine if an order occurred during a campaign by checking if order_date falls between start_date and end_date
        
        ### Customer Lifecycle Analysis
        - Use CUSTOMERS.signup_date for customer acquisition analysis
        - Use CUSTOMERS.created_at for record creation timestamp
        
        ### Employee Analysis
        - Use EMPLOYEES.hire_date for employee tenure and retention analysis
        
        ### Account Manager Assignment Analysis
        - Use CUSTOMER_ACCOUNT_MANAGERS.valid_from and valid_to for temporal assignment analysis
        
        ## Metric Selection Guidance
        
        ### Revenue Metrics
        - Total Revenue: SUM(ORDERS.total_amount_usd) at order grain
        - Product Revenue: SUM(ORDER_ITEMS.line_revenue_usd) at order-item grain
        - Average Order Value: SUM(ORDERS.total_amount_usd) / COUNT(DISTINCT ORDERS.order_id)
        
        ### Cost and Profit Metrics
        - Total Cost: SUM(ORDERS.total_cost_usd) at order grain
        - Product Cost: SUM(ORDER_ITEMS.line_cost_usd) at order-item grain
        - Gross Profit: SUM(ORDERS.total_amount_usd) - SUM(ORDERS.total_cost_usd)
        - Gross Margin %: (Gross Profit / Total Revenue) * 100
        
        ### Quantity Metrics
        - Units Sold: SUM(ORDER_ITEMS.quantity) at order-item grain
        - Units Shipped: SUM(SHIPMENT_ITEMS.quantity) at shipment-item grain
        
        ### Customer Metrics
        - Customer Count: COUNT(DISTINCT CUSTOMERS.customer_id)
        - Orders per Customer: COUNT(ORDERS.order_id) / COUNT(DISTINCT ORDERS.customer_id)
        
        ### Shipment Metrics
        - Freight Cost: SUM(SHIPMENTS.freight_cost_usd) at shipment grain
        - On-Time Delivery: COUNT(CASE WHEN actual_arrival <= expected_arrival) / COUNT(shipment_id)
        - Average Delivery Delay: AVG(actual_arrival - expected_arrival) where actual_arrival > expected_arrival
        
        ## Query Restrictions and Ambiguity
        
        ### Currency Handling
        - ORDERS.total_amount_usd is always in USD
        - ORDERS.local_amount is in the currency specified by ORDERS.currency_code
        - Use EXCHANGE_RATES for currency conversion when needed
        
        ### Return Handling
        - ORDERS.is_returned indicates if an order was returned
        - Filter by is_returned = false for net revenue analysis
        - Include is_returned = true to analyze return patterns
        
        ### Status Filtering
        - ORDERS.order_status indicates order lifecycle state
        - SHIPMENTS.shipment_status indicates shipment lifecycle state
        - Filter appropriately based on analytical question
        
        ### Rating Analysis
        - ORDERS.customer_rating is optional (may be NULL)
        - Use COALESCE or filter out NULLs when calculating average ratings
        
        ### Supplier Reliability
        - SUPPLIERS.reliability_score ranges from 0 to 1 (higher is better)
        - Use this score to analyze supplier performance and selection
    
    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing comprehensive customer profiles including contact information,
          geographic location, customer segmentation, and registration details. Grain: one row per customer.
        source: CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
              - PII
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
              - PII
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
              - PII
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer
            sql_type: VARCHAR(20)
            constraints:
              - PII
          
          - name: city
            business_name: City
            description: City where the customer is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Order transaction dataset containing customer orders with order-level financial totals,
          payment information, order status, customer ratings, and currency details.
          Grain: one row per order.
        source: ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost of fulfilling the order in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing individual product line items within orders,
          including quantities, unit prices, unit costs, discounts, and calculated line-level revenue and cost.
          Grain: one row per order line item.
        source: ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: Calculated revenue for the order item line in USD after discounts
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: Calculated cost for the order item line in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Product master dataset containing product catalog information including product names,
          category assignments, supplier relationships, unit costs, unit prices, and creation timestamps.
          Grain: one row per product.
        source: PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master dataset containing category definitions and hierarchical relationships
          through parent category references, enabling category roll-up analysis.
          Grain: one row per product category.
        source: PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: stores
        business_name: Stores
        description: >-
          Store master dataset containing store location information, store types,
          and creation timestamps. Grain: one row per store.
        source: STORES
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: City where the store is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical
            sql_type: VARCHAR(30)
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Supplier master dataset containing supplier organization information, contact details,
          country location, reliability scores, and creation timestamps. Grain: one row per supplier.
        source: SUPPLIERS
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Country
            description: Country where the supplier is based
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier
            sql_type: VARCHAR(150)
            constraints:
              - PII
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier (0 to 1, higher is better)
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment transaction dataset containing shipment details including supplier and store references,
          shipment dates, expected and actual arrival dates, freight costs, and shipment status.
          Grain: one row per shipment.
        source: SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item dataset containing individual product line items within shipments,
          including product references and quantities. Grain: one row per shipment line item.
        source: SHIPMENT_ITEMS
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign master dataset containing campaign definitions, marketing channels,
          target customer segments, campaign periods, and discount percentages. Grain: one row per campaign.
        source: CAMPAIGNS
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: employees
        business_name: Employees
        description: >-
          Employee master dataset containing employee information including names, job roles,
          manager relationships, regional assignments, and hire dates. Grain: one row per employee.
        source: EMPLOYEES
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
              - PII
          
          - name: role
            business_name: Role
            description: Job role or position of the employee
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Customer account manager assignment dataset representing a Slowly Changing Dimension Type-2 pattern.
          Tracks which account manager is assigned to each customer over time with temporal validity periods.
          Multiple records may exist for the same customer representing different assignment periods.
          Grain: one row per customer-account manager assignment with temporal validity.
        source: CUSTOMER_ACCOUNT_MANAGERS
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends (NULL indicates current assignment)
            sql_type: DATE
            dimension:
              is_time: true
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Exchange rate reference dataset containing currency conversion rates against USD for specific dates.
          Supports as-of date lookups for currency conversion. Grain: one row per currency per date.
        source: EXCHANGE_RATES
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL
    
    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is placed by exactly one customer.
          A customer may place zero or many orders.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store.
          A store may fulfill zero or many orders.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order.
          An order contains one or many order items. CRITICAL: Do not sum order-level measures
          (total_amount_usd, total_cost_usd) after joining to order_items to avoid double-counting.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product.
          A product may appear in zero or many order items.
      
      - name: products_to_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          A category may contain zero or many products.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is provided by exactly one supplier.
          A supplier may provide zero or many products.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier.
          A supplier may send zero or many shipments.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is delivered to exactly one store.
          A store may receive zero or many shipments.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment.
          A shipment contains one or many shipment items. CRITICAL: Do not sum shipment-level measures
          (freight_cost_usd) after joining to shipment_items to avoid double-counting.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product.
          A product may appear in zero or many shipment items.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each account manager assignment references exactly one customer.
          A customer may have multiple assignment records over time (SCD Type-2 pattern).
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each account manager assignment references exactly one employee.
          An employee may be assigned to zero or many customers over time.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship representing the management hierarchy.
          Each employee may report to one manager (referenced by manager_id).
          A manager may have zero or many direct reports.
          Use recursive CTEs to traverse the full organizational hierarchy and calculate
          team sizes, reporting chains, and management levels.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship representing the category hierarchy.
          Each category may have a parent category (referenced by parent_category_id).
          A parent category may have zero or many child categories.
          Use recursive CTEs to traverse the full category hierarchy and enable
          roll-up analysis from subcategories to parent categories.
      
      - name: orders_to_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship. Joins orders to the account manager who was assigned
          to the customer at the time of the order. Join condition:
          orders.customer_id = customer_account_managers.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND orders.order_date::date < COALESCE(customer_account_managers.valid_to, '9999-12-31'::date)
          NULL valid_to indicates the current assignment. This enables analysis of order performance
          by account manager based on who was responsible at the time of the order.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of temporal relationship. Joins orders to the most recent exchange rate available
          as of the order date. Join condition:
          orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date <= orders.order_date::date
          ORDER BY exchange_rates.rate_date DESC LIMIT 1
          This returns the exchange rate that was effective at the time of the order,
          enabling accurate currency conversion for historical orders.
    
    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total order revenue in USD. Calculated as the sum of total_amount_usd from the orders dataset.
          Use this metric for order-level revenue analysis. Do not use after joining orders to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total order cost in USD. Calculated as the sum of total_cost_usd from the orders dataset.
          Use this metric for order-level cost analysis. Do not use after joining orders to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Total gross profit in USD. Calculated as total revenue minus total cost at order level.
          Formula: SUM(total_amount_usd) - SUM(total_cost_usd)
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross profit margin as a percentage of revenue. Calculated as (gross profit / revenue) * 100.
          Includes safe division to handle zero revenue scenarios.
          Formula: ((SUM(total_amount_usd) - SUM(total_cost_usd)) / NULLIF(SUM(total_amount_usd), 0)) * 100
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (
                            (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd))
                            / NULLIF(SUM(orders.total_amount_usd), 0)
                        ) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Calculated as the count of distinct order_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Calculated as the count of distinct customer_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value in USD. Calculated as total revenue divided by number of orders.
          Formula: SUM(total_amount_usd) / COUNT(DISTINCT order_id)
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.order_id), 0) AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: product_revenue_usd
        business_name: Product Revenue USD
        description: >-
          Total product-level revenue in USD. Calculated as the sum of line_revenue_usd from order_items.
          Use this metric for product-level or order-item-level revenue analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd
                FROM order_items
              columns_used:
                - order_items.line_revenue_usd
      
      - name: product_cost_usd
        business_name: Product Cost USD
        description: >-
          Total product-level cost in USD. Calculated as the sum of line_cost_usd from order_items.
          Use this metric for product-level or order-item-level cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.line_cost_usd) AS product_cost_usd
                FROM order_items
              columns_used:
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold. Calculated as the sum of quantity from order_items.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage applied to order items. Calculated as the arithmetic mean
          of discount_pct from order_items.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(order_items.discount_pct) AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
      
      - name: freight_cost_usd
        business_name: Freight Cost USD
        description: >-
          Total freight cost in USD. Calculated as the sum of freight_cost_usd from shipments.
          Use this metric at shipment grain only. Do not use after joining shipments to shipment_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Calculated as the count of distinct shipment_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped. Calculated as the sum of quantity from shipment_items.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments delivered on time or early. Calculated as the count of shipments
          where actual_arrival <= expected_arrival divided by total shipments with actual arrival data.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (COUNT(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 END)::DECIMAL
                     / NULLIF(COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL THEN 1 END), 0)) * 100 AS on_time_delivery_pct
                FROM shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average number of days by which shipments are delayed. Calculated only for shipments
          where actual_arrival > expected_arrival. Formula: AVG(actual_arrival - expected_arrival)
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival > shipments.expected_arrival
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer. Calculated as total orders divided by total customers.
          Formula: COUNT(order_id) / COUNT(DISTINCT customer_id)
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id)::DECIMAL / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer in USD. Calculated as total revenue divided by number of unique customers.
          Formula: SUM(total_amount_usd) / COUNT(DISTINCT customer_id)
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all rated orders. Calculated as the arithmetic mean
          of customer_rating from orders where rating is not null.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that were returned. Calculated as the count of orders where
          is_returned = true divided by total orders.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (COUNT(CASE WHEN orders.is_returned = true THEN 1 END)::DECIMAL
                     / NULLIF(COUNT(orders.order_id), 0)) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.is_returned
                - orders.order_id
      
      - name: product_count
        business_name: Product Count
        description: >-
          Total number of unique products. Calculated as the count of distinct product_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT products.product_id) AS product_count
                FROM products
              columns_used:
                - products.product_id
      
      - name: supplier_count
        business_name: Supplier Count
        description: >-
          Total number of unique suppliers. Calculated as the count of distinct supplier_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT suppliers.supplier_id) AS supplier_count
                FROM suppliers
              columns_used:
                - suppliers.supplier_id
      
      - name: average_supplier_reliability
        business_name: Average Supplier Reliability
        description: >-
          Average reliability score across all suppliers. Calculated as the arithmetic mean
          of reliability_score from suppliers.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(suppliers.reliability_score) AS average_supplier_reliability
                FROM suppliers
              columns_used:
                - suppliers.reliability_score
      
      - name: campaign_count
        business_name: Campaign Count
        description: >-
          Total number of marketing campaigns. Calculated as the count of distinct campaign_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT campaigns.campaign_id) AS campaign_count
                FROM campaigns
              columns_used:
                - campaigns.campaign_id
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue in USD aggregated by month. Uses order_date to determine the month.
          Result grain: one row per month.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: monthly_order_count
        business_name: Monthly Order Count
        description: >-
          Total number of orders aggregated by month. Uses order_date to determine the month.
          Result grain: one row per month.
        return_type: integer
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    COUNT(DISTINCT orders.order_id) AS monthly_order_count
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.order_id
      
      - name: revenue_growth_mom_pct
        business_name: Revenue Growth Month-over-Month Percentage
        description: >-
          Month-over-month revenue growth percentage. Calculated as the percentage change
          in revenue compared to the previous month using LAG window function.
          Formula: ((current_month_revenue - previous_month_revenue) / previous_month_revenue) * 100
        return_type: percentage
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                    SELECT
                        DATE_TRUNC('month', orders.order_date) AS order_month,
                        SUM(orders.total_amount_usd) AS revenue
                    FROM orders
                    GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                    order_month,
                    revenue,
                    LAG(revenue) OVER (ORDER BY order_month) AS previous_month_revenue,
                    CASE
                        WHEN LAG(revenue) OVER (ORDER BY order_month) IS NULL THEN NULL
                        WHEN LAG(revenue) OVER (ORDER BY order_month) = 0 THEN NULL
                        ELSE ((revenue - LAG(revenue) OVER (ORDER BY order_month))
                              / LAG(revenue) OVER (ORDER BY order_month)) * 100
                    END AS revenue_growth_mom_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: running_total_revenue_usd
        business_name: Running Total Revenue USD
        description: >-
          Cumulative running total of revenue over time. Calculated using SUM window function
          ordered by order_date. Result grain: one row per order.
        return_type: currency_usd
        result_grain: one row per order
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_id,
                    orders.order_date,
                    orders.total_amount_usd,
                    SUM(orders.total_amount_usd) OVER (ORDER BY orders.order_date) AS running_total_revenue_usd
                FROM orders
                ORDER BY orders.order_date
              columns_used:
                - orders.order_id
                - orders.order_date
                - orders.total_amount_usd
      
      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Rank of customers by total revenue in descending order. Calculated using RANK window function.
          Result grain: one row per customer.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.customer_id,
                    SUM(orders.total_amount_usd) AS customer_revenue,
                    RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS customer_revenue_rank
                FROM orders
                GROUP BY orders.customer_id
                ORDER BY customer_revenue_rank
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
      
      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Rank of products by total revenue in descending order. Calculated using RANK window function
          on line_revenue_usd from order_items. Result grain: one row per product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_revenue,
                    RANK() OVER (ORDER BY SUM(order_items.line_revenue_usd) DESC) AS product_revenue_rank
                FROM order_items
                GROUP BY order_items.product_id
                ORDER BY product_revenue_rank
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: employee_count
        business_name: Employee Count
        description: >-
          Total number of employees. Calculated as the count of distinct employee_id values.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT employees.employee_id) AS employee_count
                FROM employees
              columns_used:
                - employees.employee_id
      
      - name: direct_reports_count
        business_name: Direct Reports Count
        description: >-
          Number of direct reports for each manager. Calculated by counting employees
          who report to each manager_id. Result grain: one row per manager.
        return_type: integer
        result_grain: one row per manager
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    e.manager_id,
                    COUNT(e.employee_id) AS direct_reports_count
                FROM employees e
                WHERE e.manager_id IS NOT NULL
                GROUP BY e.manager_id
                ORDER BY e.manager_id
              columns_used:
                - employees.employee_id
                - employees.manager_id
version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, and employee management.
      This model enables end-to-end analysis of customer journeys, order fulfillment, product performance,
      supplier reliability, and campaign effectiveness across multiple channels and geographies.
    
    ai_context:
      instructions: >-
        ## Dataset Grain Guide
        
        - CUSTOMERS: One row per customer (grain: customer_id)
        - ORDERS: One row per order (grain: order_id)
        - ORDER_ITEMS: One row per order line item (grain: order_item_id)
        - PRODUCTS: One row per product (grain: product_id)
        - PRODUCT_CATEGORIES: One row per product category (grain: category_id)
        - STORES: One row per store (grain: store_id)
        - SUPPLIERS: One row per supplier (grain: supplier_id)
        - SHIPMENTS: One row per shipment (grain: shipment_id)
        - SHIPMENT_ITEMS: One row per shipment line item (grain: shipment_item_id)
        - CAMPAIGNS: One row per marketing campaign (grain: campaign_id)
        - EMPLOYEES: One row per employee (grain: employee_id)
        - CUSTOMER_ACCOUNT_MANAGERS: One row per customer-account manager assignment with temporal validity (grain: assignment_id)
        - EXCHANGE_RATES: One row per currency per date (grain: currency_code + rate_date)
        
        ## Critical Join Guidance
        
        ### Standard Relationships
        - ORDERS to CUSTOMERS: orders.customer_id = customers.customer_id (many-to-one)
        - ORDERS to STORES: orders.store_id = stores.store_id (many-to-one)
        - ORDER_ITEMS to ORDERS: order_items.order_id = orders.order_id (many-to-one)
        - ORDER_ITEMS to PRODUCTS: order_items.product_id = products.product_id (many-to-one)
        - PRODUCTS to PRODUCT_CATEGORIES: products.category_id = product_categories.category_id (many-to-one)
        - PRODUCTS to SUPPLIERS: products.supplier_id = suppliers.supplier_id (many-to-one)
        - SHIPMENTS to SUPPLIERS: shipments.supplier_id = suppliers.supplier_id (many-to-one)
        - SHIPMENTS to STORES: shipments.store_id = stores.store_id (many-to-one)
        - SHIPMENT_ITEMS to SHIPMENTS: shipment_items.shipment_id = shipments.shipment_id (many-to-one)
        - SHIPMENT_ITEMS to PRODUCTS: shipment_items.product_id = products.product_id (many-to-one)
        
        ### Hierarchical Relationship
        - PRODUCT_CATEGORIES self-reference: product_categories.parent_category_id = product_categories.category_id
          This enables category hierarchy traversal (e.g., Electronics > Computers > Laptops)
        
        ### Recursive Relationship
        - EMPLOYEES self-reference: employees.manager_id = employees.employee_id
          This enables organizational hierarchy traversal and management chain analysis
        
        ### SCD Type-2 Temporal Relationship
        - CUSTOMER_ACCOUNT_MANAGERS to CUSTOMERS and EMPLOYEES with temporal validity:
          Join condition: customer_account_managers.customer_id = customers.customer_id
          AND customer_account_managers.employee_id = employees.employee_id
          Temporal filter: analysis_date >= customer_account_managers.valid_from
          AND (customer_account_managers.valid_to IS NULL OR analysis_date <= customer_account_managers.valid_to)
          This relationship tracks which account manager was assigned to which customer during specific time periods
        
        ### As-Of Relationship
        - ORDERS to EXCHANGE_RATES for currency conversion:
          Join condition: orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date = (
            SELECT MAX(er2.rate_date)
            FROM exchange_rates er2
            WHERE er2.currency_code = orders.currency_code
            AND er2.rate_date <= orders.order_date::date
          )
          This retrieves the most recent exchange rate as of the order date
        
        ## Double-Counting Prevention
        
        ### Order-Level vs Order-Item-Level Measures
        - Use orders.total_amount_usd for order-level revenue analysis
        - Use orders.total_cost_usd for order-level cost analysis
        - Use order_items.line_revenue_usd for product-level or order-item-level revenue analysis
        - Use order_items.line_cost_usd for product-level or order-item-level cost analysis
        - NEVER sum orders.total_amount_usd after joining orders to order_items (causes duplication)
        - NEVER sum orders.total_cost_usd after joining orders to order_items (causes duplication)
        
        ### Shipment-Level vs Shipment-Item-Level Measures
        - Use shipments.freight_cost_usd for shipment-level freight cost analysis
        - NEVER sum shipments.freight_cost_usd after joining shipments to shipment_items (causes duplication)
        
        ### Customer-Level Measures
        - When analyzing customer metrics across orders, ensure proper aggregation at customer grain
        - Use COUNT(DISTINCT orders.order_id) when counting orders per customer after joins
        
        ## Time Analysis Guidance
        
        ### Transaction Dates
        - Use orders.order_date for sales transaction time analysis
        - Use shipments.ship_date for shipment departure time analysis
        - Use shipments.actual_arrival for shipment arrival time analysis
        - Use campaigns.start_date and campaigns.end_date for campaign period analysis
        
        ### Temporal Validity
        - Use customer_account_managers.valid_from and valid_to for historical account manager assignments
        - Use exchange_rates.rate_date for currency conversion as of specific dates
        
        ### Record Creation Tracking
        - Use customers.created_at for customer registration tracking
        - Use products.created_at for product catalog additions
        - Use stores.created_at for store opening tracking
        - Use suppliers.created_at for supplier onboarding tracking
        
        ## Metric Interpretation
        
        ### Revenue Metrics
        - Total Revenue: Sum of all order amounts (order-level grain)
        - Product Revenue: Sum of order item line revenues (product-level grain)
        - Gross Profit: Total Revenue - Total Cost
        - Gross Margin %: (Gross Profit / Total Revenue) * 100
        
        ### Sales Performance Metrics
        - Average Order Value: Total Revenue / Order Count
        - Units Sold: Sum of order item quantities
        - Average Selling Price: Product Revenue / Units Sold (product-level)
        
        ### Fulfillment Metrics
        - Delivery Delay Days: actual_arrival - expected_arrival (positive = late, negative = early)
        - On-Time Delivery Rate: (Count of on-time shipments / Total shipments) * 100
        - Total Freight Cost: Sum of shipment freight costs
        
        ### Customer Metrics
        - Customer Count: COUNT(DISTINCT customer_id)
        - Orders per Customer: Total Orders / Customer Count
        - Revenue per Customer: Total Revenue / Customer Count
        
        ### Product Metrics
        - Product Profit: Product Revenue - Product Cost
        - Product Margin %: (Product Profit / Product Revenue) * 100
        
        ### Campaign Metrics
        - Campaign orders must be attributed using date range logic
        - Order is attributed to campaign if order_date BETWEEN campaign.start_date AND campaign.end_date
        - Filter by orders.order_channel = campaigns.channel for channel-specific attribution
        - Filter by customers.customer_segment = campaigns.target_segment for segment-specific attribution
        
        ## Query Restrictions and Ambiguities
        
        ### Currency Handling
        - Primary currency is USD for all monetary measures
        - orders.local_amount represents order value in local currency
        - Use exchange_rates with as-of join for historical currency conversion
        - Always specify currency when reporting monetary values
        
        ### Status Fields
        - orders.order_status: Current order state (Placed, Shipped, Delivered, Cancelled, etc.)
        - shipments.shipment_status: Current shipment state (In Transit, Delivered, etc.)
        - Filter appropriately based on analytical requirements
        
        ### Returns Handling
        - orders.is_returned indicates if order was returned
        - Returned orders may still contribute to gross revenue but should be analyzed separately for net revenue
        
        ### Rating Analysis
        - orders.customer_rating: Optional customer satisfaction rating (1-5 scale)
        - NULL ratings indicate no rating provided
        - Use AVG(customer_rating) excluding NULLs for average rating calculations
        
        ### Hierarchical Queries
        - Product category hierarchy requires recursive traversal via parent_category_id
        - Employee management hierarchy requires recursive traversal via manager_id
        - Use recursive CTEs for multi-level hierarchy analysis
        
        ### Temporal Queries
        - Customer account manager assignments change over time
        - Always apply valid_from/valid_to filters when analyzing historical assignments
        - NULL valid_to indicates current active assignment

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing comprehensive customer profiles including contact information,
          geographic location, customer segmentation, and registration history. Grain: one row per customer.
        source: customers
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer
            sql_type: VARCHAR(20)
          
          - name: city
            business_name: City
            description: City where the customer is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Order transaction dataset capturing customer orders including order details, payment information,
          channel, status, ratings, and monetary amounts in both USD and local currency. Grain: one row per order.
        source: orders
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Indicates whether the order has been returned
            sql_type: BOOL
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: Currency code used for the order amounts
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: Total order amount in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: Total cost of fulfilling the order in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing individual products within orders, including quantities, unit prices,
          unit costs, discounts, and calculated line-level revenue and cost. Grain: one row per order line item.
        source: order_items
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: Calculated revenue for the order item line in USD after discounts
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: Calculated cost for the order item line in USD
            sql_type: NUMERIC(12,2)
            constraints:
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Product catalog dataset containing product definitions, pricing, costs, category assignments,
          and supplier relationships. Grain: one row per product.
        source: products
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category hierarchy dataset containing category definitions and parent-child relationships
          enabling multi-level category analysis. Grain: one row per product category.
        source: product_categories
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: References the parent category in the hierarchy
            sql_type: INT4
            constraints:
              - FOREIGN KEY
      
      - name: stores
        business_name: Stores
        description: >-
          Store location dataset containing store definitions, geographic locations, store types,
          and operational metadata. Grain: one row per store.
        source: stores
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: City where the store is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store, such as online or physical
            sql_type: VARCHAR(30)
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Supplier master dataset containing supplier organization details, contact information,
          geographic location, and reliability metrics. Grain: one row per supplier.
        source: suppliers
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Country
            description: Country where the supplier is based
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier
            sql_type: VARCHAR(150)
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier
            sql_type: NUMERIC(3,2)
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment transaction dataset tracking product shipments from suppliers to stores, including
          shipment dates, arrival tracking, freight costs, and shipment status. Grain: one row per shipment.
        source: shipments
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed
            sql_type: TIMESTAMP
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item dataset containing individual products within shipments and their quantities.
          Grain: one row per shipment line item.
        source: shipment_items
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign dataset containing campaign definitions, target segments, channels,
          date ranges, and discount offerings. Grain: one row per marketing campaign.
        source: campaigns
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
      
      - name: employees
        business_name: Employees
        description: >-
          Employee master dataset containing employee profiles, job roles, regional assignments,
          management hierarchy relationships, and hire dates. Grain: one row per employee.
        source: employees
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: Job role or position of the employee
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: References the employee who manages this employee
            sql_type: INT4
            constraints:
              - FOREIGN KEY
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Customer account manager assignment dataset tracking which employees are assigned as account managers
          to which customers with temporal validity periods. Supports SCD Type-2 historical tracking.
          Grain: one row per customer-account manager assignment with validity period.
        source: customer_account_managers
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment
            sql_type: serial
            constraints:
              - PRIMARY KEY
              - NOT NULL
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager
            sql_type: INT4
            constraints:
              - FOREIGN KEY
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: Date when the account manager assignment ends
            sql_type: DATE
            dimension:
              is_time: true
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Currency exchange rate dataset containing daily exchange rates for various currencies against USD.
          Grain: one row per currency per date.
        source: exchange_rates
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each order to the customer who placed it.
          Multiple orders can belong to one customer.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each order to the store fulfilling it.
          Multiple orders can be fulfilled by one store.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each order line item to its parent order.
          Multiple order items belong to one order. Critical for grain management: do not sum
          order-level measures after this join to avoid duplication.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each order line item to the product being ordered.
          Multiple order items can reference the same product.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each product to its category.
          Multiple products can belong to one category.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each product to its supplier.
          Multiple products can be supplied by one supplier.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each shipment to the supplier responsible for it.
          Multiple shipments can originate from one supplier.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each shipment to its destination store.
          Multiple shipments can be delivered to one store.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each shipment line item to its parent shipment.
          Multiple shipment items belong to one shipment. Critical for grain management: do not sum
          shipment-level measures after this join to avoid duplication.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking each shipment line item to the product being shipped.
          Multiple shipment items can reference the same product.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Hierarchical self-referencing relationship enabling product category hierarchy traversal.
          Each category can have one parent category. Root categories have NULL parent_category_id.
          Use recursive CTEs to traverse the complete category hierarchy for multi-level rollups.
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Recursive self-referencing relationship enabling organizational hierarchy traversal.
          Each employee can have one manager. Top-level executives have NULL manager_id.
          Use recursive CTEs to traverse the complete management chain, calculate team sizes,
          or determine reporting relationships at any level.
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking account manager assignments to customers.
          Multiple assignments (across time) can exist for one customer due to temporal validity tracking.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship linking account manager assignments to employees.
          Multiple assignments can exist for one employee as they manage different customers over time.
      
      - name: orders_to_customer_account_managers_scd
        left_dataset: orders
        right_dataset: customer_account_managers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
            - order_date
          right:
            - customer_id
            - valid_from
            - valid_to
        join_type: scd_type2_date_range
        resolution: >-
          SCD Type-2 temporal relationship linking orders to the account manager who was assigned to the customer
          at the time the order was placed. Join condition: orders.customer_id = customer_account_managers.customer_id
          AND orders.order_date::date >= customer_account_managers.valid_from
          AND (customer_account_managers.valid_to IS NULL OR orders.order_date::date <= customer_account_managers.valid_to).
          This enables historical analysis of which account manager was responsible for which orders.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of temporal relationship for currency conversion. Retrieves the most recent exchange rate
          as of the order date. Join condition: orders.currency_code = exchange_rates.currency_code
          AND exchange_rates.rate_date = (SELECT MAX(er2.rate_date) FROM exchange_rates er2
          WHERE er2.currency_code = orders.currency_code AND er2.rate_date <= orders.order_date::date).
          This enables accurate historical currency conversion using the exchange rate that was valid
          at the time of the transaction.

    metrics:
      - name: total_revenue_usd
        business_name: Total Revenue USD
        description: >-
          Total revenue from all orders in USD. Calculated as the sum of order-level total amounts.
          Use this metric for order-level revenue analysis. Do not use after joining orders to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) AS total_revenue_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost_usd
        business_name: Total Cost USD
        description: >-
          Total cost of fulfilling all orders in USD. Calculated as the sum of order-level total costs.
          Use this metric for order-level cost analysis. Do not use after joining orders to order_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_cost_usd) AS total_cost_usd
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit_usd
        business_name: Gross Profit USD
        description: >-
          Gross profit calculated as total revenue minus total cost at order level.
          Formula: Total Revenue - Total Cost.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage calculated as (Gross Profit / Total Revenue) * 100.
          Includes safe division to handle zero revenue scenarios.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    CASE
                        WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                        ELSE (
                            (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd))
                            / NULLIF(SUM(orders.total_amount_usd), 0)
                        ) * 100
                    END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of orders. Use COUNT(DISTINCT orders.order_id) when joining to order_items
          to avoid duplication.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of unique customers. Use COUNT(DISTINCT) to ensure uniqueness across joins.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value_usd
        business_name: Average Order Value USD
        description: >-
          Average order value calculated as Total Revenue / Order Count.
          Represents the average amount per order in USD.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(orders.order_id), 0) AS average_order_value_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: product_revenue_usd
        business_name: Product Revenue USD
        description: >-
          Total revenue at product/order-item level calculated as the sum of line revenues.
          Use this metric for product-level revenue analysis. Formula: SUM(line_revenue_usd).
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: product_cost_usd
        business_name: Product Cost USD
        description: >-
          Total cost at product/order-item level calculated as the sum of line costs.
          Use this metric for product-level cost analysis. Formula: SUM(line_cost_usd).
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_cost_usd) AS product_cost_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_cost_usd
      
      - name: product_profit_usd
        business_name: Product Profit USD
        description: >-
          Product-level profit calculated as product revenue minus product cost.
          Formula: SUM(line_revenue_usd) - SUM(line_cost_usd).
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_profit_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: product_margin_pct
        business_name: Product Margin Percentage
        description: >-
          Product-level margin percentage calculated as (Product Profit / Product Revenue) * 100.
          Includes safe division to handle zero revenue scenarios.
        return_type: percentage
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    CASE
                        WHEN SUM(order_items.line_revenue_usd) = 0 THEN 0
                        ELSE (
                            (SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd))
                            / NULLIF(SUM(order_items.line_revenue_usd), 0)
                        ) * 100
                    END AS product_margin_pct
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold across all order items.
          Formula: SUM(quantity).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(order_items.quantity) AS units_sold
                FROM order_items
              columns_used:
                - order_items.quantity
      
      - name: average_selling_price_usd
        business_name: Average Selling Price USD
        description: >-
          Average selling price per unit calculated as Product Revenue / Units Sold.
          Represents the weighted average price considering quantities and discounts.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) / NULLIF(SUM(order_items.quantity), 0) AS average_selling_price_usd
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.quantity
      
      - name: total_freight_cost_usd
        business_name: Total Freight Cost USD
        description: >-
          Total freight cost across all shipments in USD.
          Use this metric for shipment-level freight analysis. Do not use after joining shipments to shipment_items.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipments.freight_cost_usd) AS total_freight_cost_usd
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of shipments. Use COUNT(DISTINCT shipments.shipment_id) when joining to shipment_items
          to avoid duplication.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: units_shipped
        business_name: Units Shipped
        description: >-
          Total number of product units shipped across all shipment items.
          Formula: SUM(quantity).
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(shipment_items.quantity) AS units_shipped
                FROM shipment_items
              columns_used:
                - shipment_items.quantity
      
      - name: average_delivery_delay_days
        business_name: Average Delivery Delay Days
        description: >-
          Average delivery delay in days calculated as the difference between actual arrival and expected arrival.
          Positive values indicate late deliveries, negative values indicate early deliveries.
          Only includes shipments with both actual and expected arrival dates.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(shipments.actual_arrival - shipments.expected_arrival) AS average_delivery_delay_days
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.expected_arrival IS NOT NULL
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_rate_pct
        business_name: On-Time Delivery Rate Percentage
        description: >-
          Percentage of shipments delivered on or before the expected arrival date.
          Formula: (Count of on-time shipments / Total shipments with arrival data) * 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN 1 END)::DECIMAL
                        / NULLIF(COUNT(CASE WHEN shipments.actual_arrival IS NOT NULL AND shipments.expected_arrival IS NOT NULL THEN 1 END), 0)
                    ) * 100 AS on_time_delivery_rate_pct
                FROM shipments
              columns_used:
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: orders_per_customer
        business_name: Orders Per Customer
        description: >-
          Average number of orders per customer calculated as Total Orders / Customer Count.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    COUNT(orders.order_id)::DECIMAL / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer_usd
        business_name: Revenue Per Customer USD
        description: >-
          Average revenue per customer calculated as Total Revenue / Customer Count.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer_usd
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer satisfaction rating across all orders with ratings.
          Excludes orders without ratings (NULL values).
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that were returned.
          Formula: (Count of returned orders / Total orders) * 100.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    (
                        COUNT(CASE WHEN orders.is_returned = true THEN 1 END)::DECIMAL
                        / NULLIF(COUNT(orders.order_id), 0)
                    ) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.is_returned
                - orders.order_id
      
      - name: monthly_revenue_usd
        business_name: Monthly Revenue USD
        description: >-
          Total revenue aggregated by month based on order date.
          Enables month-over-month revenue trend analysis.
        return_type: currency_usd
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    DATE_TRUNC('month', orders.order_date) AS order_month,
                    SUM(orders.total_amount_usd) AS monthly_revenue_usd
                FROM orders
                GROUP BY DATE_TRUNC('month', orders.order_date)
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: revenue_growth_mom_pct
        business_name: Revenue Growth Month-over-Month Percentage
        description: >-
          Month-over-month revenue growth percentage calculated using LAG window function.
          Formula: ((Current Month Revenue - Previous Month Revenue) / Previous Month Revenue) * 100.
        return_type: percentage
        result_grain: one row per month
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH monthly_revenue AS (
                    SELECT
                        DATE_TRUNC('month', orders.order_date) AS order_month,
                        SUM(orders.total_amount_usd) AS monthly_revenue_usd
                    FROM orders
                    GROUP BY DATE_TRUNC('month', orders.order_date)
                )
                SELECT
                    order_month,
                    CASE
                        WHEN LAG(monthly_revenue_usd) OVER (ORDER BY order_month) = 0 THEN NULL
                        ELSE (
                            (monthly_revenue_usd - LAG(monthly_revenue_usd) OVER (ORDER BY order_month))
                            / NULLIF(LAG(monthly_revenue_usd) OVER (ORDER BY order_month), 0)
                        ) * 100
                    END AS revenue_growth_mom_pct
                FROM monthly_revenue
                ORDER BY order_month
              columns_used:
                - orders.order_date
                - orders.total_amount_usd
      
      - name: running_total_revenue_usd
        business_name: Running Total Revenue USD
        description: >-
          Cumulative revenue over time calculated using window function SUM() OVER.
          Provides running total of revenue ordered by order date.
        return_type: currency_usd
        result_grain: one row per order
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.order_id,
                    orders.order_date,
                    orders.total_amount_usd,
                    SUM(orders.total_amount_usd) OVER (ORDER BY orders.order_date, orders.order_id) AS running_total_revenue_usd
                FROM orders
                ORDER BY orders.order_date, orders.order_id
              columns_used:
                - orders.order_id
                - orders.order_date
                - orders.total_amount_usd
      
      - name: product_revenue_rank
        business_name: Product Revenue Rank
        description: >-
          Ranking of products by total revenue using DENSE_RANK window function.
          Rank 1 represents the highest revenue product.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    order_items.product_id,
                    SUM(order_items.line_revenue_usd) AS product_revenue_usd,
                    DENSE_RANK() OVER (ORDER BY SUM(order_items.line_revenue_usd) DESC) AS product_revenue_rank
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: customer_revenue_rank
        business_name: Customer Revenue Rank
        description: >-
          Ranking of customers by total revenue using DENSE_RANK window function.
          Rank 1 represents the highest revenue customer.
        return_type: integer
        result_grain: one row per customer
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    orders.customer_id,
                    SUM(orders.total_amount_usd) AS customer_revenue_usd,
                    DENSE_RANK() OVER (ORDER BY SUM(orders.total_amount_usd) DESC) AS customer_revenue_rank
                FROM orders
                GROUP BY orders.customer_id
              columns_used:
                - orders.customer_id
                - orders.total_amount_usd
      
      - name: employee_team_size
        business_name: Employee Team Size
        description: >-
          Number of direct reports for each employee calculated using recursive CTE to traverse
          the employee management hierarchy. Includes only direct reports (one level down).
        return_type: integer
        result_grain: one row per employee
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                    e1.employee_id,
                    e1.employee_name,
                    COUNT(e2.employee_id) AS employee_team_size
                FROM employees e1
                LEFT JOIN employees e2 ON e2.manager_id = e1.employee_id
                GROUP BY e1.employee_id, e1.employee_name
              columns_used:
                - employees.employee_id
                - employees.employee_name
                - employees.manager_id
      
      - name: category_hierarchy_revenue_usd
        business_name: Category Hierarchy Revenue USD
        description: >-
          Revenue aggregated by product category including hierarchical rollup using recursive CTE
          to traverse the category parent-child relationships. Enables multi-level category analysis.
        return_type: currency_usd
        result_grain: one row per category
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                WITH RECURSIVE category_tree AS (
                    SELECT
                        category_id,
                        category_name,
                        parent_category_id,
                        category_id AS root_category_id
                    FROM product_categories
                    WHERE parent_category_id IS NULL
                    
                    UNION ALL
                    
                    SELECT
                        pc.category_id,
                        pc.category_name,
                        pc.parent_category_id,
                        ct.root_category_id
                    FROM product_categories pc
                    INNER JOIN category_tree ct ON pc.parent_category_id = ct.category_id
                )
                SELECT
                    ct.category_id,
                    ct.category_name,
                    SUM(order_items.line_revenue_usd) AS category_hierarchy_revenue_usd
                FROM category_tree ct
                INNER JOIN products ON products.category_id = ct.category_id
                INNER JOIN order_items ON order_items.product_id = products.product_id
                GROUP BY ct.category_id, ct.category_name
              columns_used:
                - product_categories.category_id
                - product_categories.category_name
                - product_categories.parent_category_id
                - products.category_id
                - products.product_id
                - order_items.product_id
                - order_items.line_revenue_usd

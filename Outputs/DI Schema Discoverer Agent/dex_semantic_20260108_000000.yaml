version: "1.0"

semantic_model:
  - name: customer_experience_semantic_model
    description: >-
      Comprehensive semantic model for Customer Experience analytics covering customer relationships,
      sales transactions, product inventory, shipment logistics, marketing campaigns, and employee management.
      This model enables end-to-end analysis of customer journeys, order fulfillment, product performance,
      supplier reliability, and marketing campaign effectiveness.
    
    ai_context:
      instructions: >-
        ## Dataset Grain and Usage
        
        - **customers**: One row per customer. Use for customer-level analysis and customer attributes.
        - **orders**: One row per order. Use for order-level revenue, cost, and profitability analysis.
        - **order_items**: One row per order line item. Use for product-level analysis within orders.
        - **products**: One row per product. Use for product catalog and pricing analysis.
        - **product_categories**: One row per product category. Supports hierarchical category analysis via parent_category_id.
        - **stores**: One row per store location. Use for store-level analysis.
        - **suppliers**: One row per supplier. Use for supplier performance and reliability analysis.
        - **shipments**: One row per shipment. Use for shipment-level logistics and freight analysis.
        - **shipment_items**: One row per shipment line item. Use for detailed shipment content analysis.
        - **campaigns**: One row per marketing campaign. Use for campaign performance analysis.
        - **employees**: One row per employee. Supports hierarchical analysis via manager_id self-reference.
        - **customer_account_managers**: One row per customer-account manager assignment with temporal validity.
          Supports SCD Type-2 analysis for historical account manager assignments.
        - **exchange_rates**: One row per currency per date. Use for currency conversion with as-of date logic.
        
        ## Measure Selection and Grain Handling
        
        **CRITICAL: Avoid Double Counting**
        
        - Use **orders.total_amount_usd** for order-level revenue analysis.
        - Use **order_items.line_revenue_usd** for product-level or order-line-level revenue analysis.
        - **NEVER** sum orders.total_amount_usd after joining orders to order_items - this will duplicate revenue.
        - Use **orders.total_cost_usd** for order-level cost analysis.
        - Use **order_items.line_cost_usd** for product-level or order-line-level cost analysis.
        - **NEVER** sum orders.total_cost_usd after joining orders to order_items - this will duplicate costs.
        
        When analyzing revenue or cost:
        - If grouping by order attributes only (customer, order_date, store, channel, status), use orders table measures.
        - If grouping by product attributes (product, category, supplier), use order_items table measures.
        - If mixing order and product attributes, use order_items table measures and be explicit about grain.
        
        ## Join Guidance
        
        **Standard Relationships:**
        - orders → customers via customer_id (many-to-one)
        - orders → stores via store_id (many-to-one)
        - order_items → orders via order_id (many-to-one)
        - order_items → products via product_id (many-to-one)
        - products → product_categories via category_id (many-to-one)
        - products → suppliers via supplier_id (many-to-one)
        - shipments → suppliers via supplier_id (many-to-one)
        - shipments → stores via store_id (many-to-one)
        - shipment_items → shipments via shipment_id (many-to-one)
        - shipment_items → products via product_id (many-to-one)
        
        **Hierarchical Relationships:**
        - product_categories → product_categories via parent_category_id (self-referencing hierarchy)
        - employees → employees via manager_id (self-referencing management hierarchy)
        
        **Temporal Relationships:**
        - customer_account_managers implements SCD Type-2 for historical account manager assignments
        - Join customers to customer_account_managers using customer_id with validity period logic
        - Join customer_account_managers to employees using employee_id to get account manager details
        
        **As-Of Relationships:**
        - exchange_rates provides currency conversion rates as of a specific date
        - Join orders to exchange_rates using currency_code and order_date with as-of logic:
          WHERE er.currency_code = o.currency_code 
          AND er.rate_date = (
            SELECT MAX(rate_date) 
            FROM exchange_rates 
            WHERE currency_code = o.currency_code 
            AND rate_date <= o.order_date::date
          )
        
        ## Time Analysis
        
        - Use **orders.order_date** for order transaction time analysis
        - Use **customers.signup_date** for customer acquisition time analysis
        - Use **customers.created_at** for customer record creation time analysis
        - Use **shipments.ship_date** for shipment departure time analysis
        - Use **shipments.expected_arrival** and **shipments.actual_arrival** for delivery performance analysis
        - Use **campaigns.start_date** and **campaigns.end_date** for campaign period analysis
        - Use **employees.hire_date** for employee tenure analysis
        - Use **exchange_rates.rate_date** for currency rate effective date analysis
        
        ## SCD Type-2 Guidance
        
        The customer_account_managers table implements Slowly Changing Dimension Type-2 pattern:
        - Multiple records can exist for the same customer_id
        - Each record has a validity period defined by valid_from and valid_to
        - valid_to = NULL indicates the current active assignment
        - To get current account manager: WHERE valid_to IS NULL
        - To get historical account manager as of a specific date:
          WHERE valid_from <= <date> AND (valid_to IS NULL OR valid_to > <date>)
        
        ## Hierarchical Analysis
        
        **Product Category Hierarchy:**
        - product_categories.parent_category_id references product_categories.category_id
        - Use recursive CTE to traverse the full category hierarchy
        - Root categories have parent_category_id = NULL
        
        **Employee Management Hierarchy:**
        - employees.manager_id references employees.employee_id
        - Use recursive CTE to traverse the management hierarchy
        - Top-level executives have manager_id = NULL
        - Calculate team size, reporting depth, and organizational structure using recursive queries
        
        ## Computed Fields
        
        - **order_items.line_revenue_usd**: Calculated as quantity * unit_price_usd * (1 - discount_pct / 100.0)
        - **order_items.line_cost_usd**: Calculated as quantity * unit_cost_usd
        - These are pre-computed fields; use them directly rather than recalculating
        
        ## Metrics and Formulas
        
        **Revenue Metrics:**
        - Total Revenue: SUM(orders.total_amount_usd) at order grain
        - Product Revenue: SUM(order_items.line_revenue_usd) at product grain
        - Average Order Value: SUM(orders.total_amount_usd) / COUNT(DISTINCT orders.order_id)
        
        **Profitability Metrics:**
        - Gross Profit: SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) at order grain
        - Gross Margin %: (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) / NULLIF(SUM(orders.total_amount_usd), 0) * 100
        - Product Profit: SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) at product grain
        
        **Sales Metrics:**
        - Order Count: COUNT(DISTINCT orders.order_id)
        - Units Sold: SUM(order_items.quantity)
        - Average Selling Price: SUM(order_items.line_revenue_usd) / NULLIF(SUM(order_items.quantity), 0)
        
        **Customer Metrics:**
        - Customer Count: COUNT(DISTINCT customers.customer_id)
        - Orders per Customer: COUNT(DISTINCT orders.order_id) / NULLIF(COUNT(DISTINCT customers.customer_id), 0)
        - Revenue per Customer: SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT customers.customer_id), 0)
        
        **Shipment Metrics:**
        - Shipment Count: COUNT(DISTINCT shipments.shipment_id)
        - Total Freight Cost: SUM(shipments.freight_cost_usd)
        - Delayed Shipments: COUNT(DISTINCT CASE WHEN shipments.actual_arrival > shipments.expected_arrival THEN shipments.shipment_id END)
        - On-Time Delivery %: COUNT(DISTINCT CASE WHEN shipments.actual_arrival <= shipments.expected_arrival THEN shipments.shipment_id END) / NULLIF(COUNT(DISTINCT shipments.shipment_id), 0) * 100
        
        ## Query Restrictions and Warnings
        
        - Always consider dataset grain when selecting measures
        - Be explicit about aggregation level in queries
        - Use appropriate date fields for time-based filtering
        - Handle NULL values in division operations using NULLIF or COALESCE
        - For SCD Type-2 queries, always include validity period logic
        - For as-of currency conversion, use proper date-based lookup logic
        - For hierarchical queries, use recursive CTEs with proper termination conditions
        - Validate that product-level and order-level measures are not mixed without proper grain handling

    datasets:
      - name: customers
        business_name: Customers
        description: >-
          Customer master dataset containing one row per customer. Stores comprehensive customer profiles
          including contact details, location, segment classification, and signup information. This is the
          primary dimension for customer-level analysis and customer relationship management.
        source: CUSTOMERS
        primary_key:
          - customer_id
        fields:
          - name: customer_id
            business_name: Customer Identifier
            description: Unique identifier for a customer. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: first_name
            business_name: First Name
            description: Given name of the customer. Contains PII.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: last_name
            business_name: Last Name
            description: Family name of the customer. Contains PII.
            sql_type: VARCHAR(50)
            constraints:
              - NOT NULL
          
          - name: email
            business_name: Email
            description: Email address used to contact the customer. Contains PII. Must be unique.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
              - UNIQUE
          
          - name: phone
            business_name: Phone
            description: Primary phone number of the customer. Contains PII.
            sql_type: VARCHAR(20)
          
          - name: city
            business_name: City
            description: City where the customer is located. Useful for geographic analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the customer is located. Useful for geographic analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: customer_segment
            business_name: Customer Segment
            description: Segment classification assigned to the customer (e.g., Regular, Premium, VIP).
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: signup_date
            business_name: Signup Date
            description: Date when the customer registered or signed up. Use for customer acquisition analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the customer record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: orders
        business_name: Orders
        description: >-
          Order transaction dataset containing one row per customer order. Records end-to-end sales transactions
          including order dates, customer references, store references, payment details, order status, and
          monetary amounts. This is the primary fact table for order-level revenue and cost analysis.
          IMPORTANT: Use orders.total_amount_usd and orders.total_cost_usd for order-level analysis only.
          Do not sum these fields after joining to order_items to avoid double counting.
        source: ORDERS
        primary_key:
          - order_id
        fields:
          - name: order_id
            business_name: Order Identifier
            description: Unique identifier for a customer order. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the customer who placed the order. Foreign key to customers.customer_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the store fulfilling the order. Foreign key to stores.store_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: order_date
            business_name: Order Date
            description: Timestamp when the order was placed. Primary date for order transaction analysis.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: order_channel
            business_name: Order Channel
            description: Channel through which the order was placed (e.g., Web, Mobile, Store).
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: payment_method
            business_name: Payment Method
            description: Method used by the customer to pay for the order (e.g., Credit Card, PayPal).
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: order_status
            business_name: Order Status
            description: Current status of the order (e.g., Placed, Shipped, Delivered, Cancelled).
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: is_returned
            business_name: Is Returned
            description: Boolean indicator of whether the order has been returned.
            sql_type: BOOL
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: customer_rating
            business_name: Customer Rating
            description: Rating provided by the customer for the order experience (typically 1-5 scale).
            sql_type: INT2
          
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code used for the order amounts (e.g., USD, EUR, GBP).
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
          
          - name: total_amount_usd
            business_name: Total Amount USD
            description: >-
              Total order amount in USD. This is the primary revenue measure at order grain.
              Use for order-level revenue analysis. Do not sum after joining to order_items.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: local_amount
            business_name: Local Amount
            description: Total order amount in the local currency specified by currency_code.
            sql_type: NUMERIC(14,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: total_cost_usd
            business_name: Total Cost USD
            description: >-
              Total cost of fulfilling the order in USD. This is the primary cost measure at order grain.
              Use for order-level cost and profitability analysis. Do not sum after joining to order_items.
            sql_type: NUMERIC(12,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: order_items
        business_name: Order Items
        description: >-
          Order line item dataset containing one row per order line item (one row per product per order).
          Records detailed product-level information within orders including quantities, unit prices, unit costs,
          discounts, and calculated line-level revenue and cost. This is the primary fact table for product-level
          analysis within orders. IMPORTANT: Use order_items.line_revenue_usd and order_items.line_cost_usd
          for product-level analysis. These measures are at a finer grain than order-level measures.
        source: ORDER_ITEMS
        primary_key:
          - order_item_id
        fields:
          - name: order_item_id
            business_name: Order Item Identifier
            description: Unique identifier for an order line item. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: order_id
            business_name: Order Reference
            description: References the related order record. Foreign key to orders.order_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the order item. Foreign key to products.product_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product ordered. Use for units sold analysis.
            sql_type: INT4
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit in USD before discount.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost per unit in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount applied to the order item (e.g., 10.00 means 10% discount).
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: line_revenue_usd
            business_name: Line Revenue USD
            description: >-
              Calculated revenue for the order item line in USD after discounts.
              Computed as: quantity * unit_price_usd * (1 - discount_pct / 100.0).
              This is the primary revenue measure at product/order-line grain.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
          
          - name: line_cost_usd
            business_name: Line Cost USD
            description: >-
              Calculated cost for the order item line in USD.
              Computed as: quantity * unit_cost_usd.
              This is the primary cost measure at product/order-line grain.
            sql_type: NUMERIC(12,2)
            constraints:
              - DEFAULT
              - COMPUTED
      
      - name: products
        business_name: Products
        description: >-
          Product master dataset containing one row per product. Contains product catalog information
          including product names, category assignments, supplier references, unit costs, unit prices,
          and creation timestamps. This is the primary dimension for product-level analysis.
        source: PRODUCTS
        primary_key:
          - product_id
        fields:
          - name: product_id
            business_name: Product Identifier
            description: Unique identifier for a product. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: product_name
            business_name: Product Name
            description: Name or title of the product.
            sql_type: VARCHAR(150)
            constraints:
              - NOT NULL
          
          - name: category_id
            business_name: Category Reference
            description: References the category to which the product belongs. Foreign key to product_categories.category_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: unit_cost_usd
            business_name: Unit Cost USD
            description: Cost to acquire or produce one unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: unit_price_usd
            business_name: Unit Price USD
            description: Selling price per unit of the product in USD.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier providing the product. Foreign key to suppliers.supplier_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the product record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: product_categories
        business_name: Product Categories
        description: >-
          Product category master dataset containing one row per product category. Supports hierarchical
          category structures through parent_category_id self-reference. Root categories have NULL parent_category_id.
          Use recursive queries to traverse the full category hierarchy.
        source: PRODUCT_CATEGORIES
        primary_key:
          - category_id
        fields:
          - name: category_id
            business_name: Category Identifier
            description: Unique identifier for a product category. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: category_name
            business_name: Category Name
            description: Name of the product category.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: parent_category_id
            business_name: Parent Category Reference
            description: >-
              References the parent category in the hierarchy. Foreign key to product_categories.category_id.
              NULL indicates a root-level category. Enables hierarchical category analysis.
            sql_type: INT4
            constraints:
              - FK
      
      - name: stores
        business_name: Stores
        description: >-
          Store master dataset containing one row per store location. Contains store names, geographic locations,
          store types, and creation timestamps. This is the primary dimension for store-level analysis.
        source: STORES
        primary_key:
          - store_id
        fields:
          - name: store_id
            business_name: Store Identifier
            description: Unique identifier for a store. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: store_name
            business_name: Store Name
            description: Name of the store.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: city
            business_name: City
            description: City where the store is located. Useful for geographic analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: country
            business_name: Country
            description: Country where the store is located. Useful for geographic analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: store_type
            business_name: Store Type
            description: Type or format of the store (e.g., Physical, Online, Warehouse).
            sql_type: VARCHAR(30)
            dimension:
              is_time: false
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the store record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: suppliers
        business_name: Suppliers
        description: >-
          Supplier master dataset containing one row per supplier. Contains supplier names, countries,
          contact information, reliability scores, and creation timestamps. This is the primary dimension
          for supplier-level analysis and supplier performance evaluation.
        source: SUPPLIERS
        primary_key:
          - supplier_id
        fields:
          - name: supplier_id
            business_name: Supplier Identifier
            description: Unique identifier for a supplier. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: supplier_name
            business_name: Supplier Name
            description: Name of the supplier organization.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: country
            business_name: Country
            description: Country where the supplier is based. Useful for geographic analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: contact_email
            business_name: Contact Email
            description: Email address for contacting the supplier. Contains PII.
            sql_type: VARCHAR(150)
          
          - name: reliability_score
            business_name: Reliability Score
            description: Score indicating the reliability of the supplier (typically 0.00 to 1.00 scale).
            sql_type: NUMERIC(3,2)
            constraints:
              - DEFAULT
          
          - name: created_at
            business_name: Created At
            description: Timestamp when the supplier record was created in the system.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: shipments
        business_name: Shipments
        description: >-
          Shipment transaction dataset containing one row per shipment. Records shipment logistics including
          supplier references, store destinations, shipment dates, expected and actual arrival dates, freight costs,
          and shipment status. This is the primary fact table for shipment and logistics analysis.
        source: SHIPMENTS
        primary_key:
          - shipment_id
        fields:
          - name: shipment_id
            business_name: Shipment Identifier
            description: Unique identifier for a shipment. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: supplier_id
            business_name: Supplier Reference
            description: References the supplier responsible for the shipment. Foreign key to suppliers.supplier_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: store_id
            business_name: Store Reference
            description: References the destination store for the shipment. Foreign key to stores.store_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: ship_date
            business_name: Ship Date
            description: Timestamp when the shipment departed. Use for shipment departure time analysis.
            sql_type: TIMESTAMP(29,6)
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: expected_arrival
            business_name: Expected Arrival
            description: Expected arrival date of the shipment. Use for delivery performance analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: actual_arrival
            business_name: Actual Arrival
            description: Actual arrival date of the shipment. Use for delivery performance analysis.
            sql_type: DATE
            dimension:
              is_time: true
          
          - name: freight_cost_usd
            business_name: Freight Cost USD
            description: Freight cost of the shipment in USD. Use for logistics cost analysis.
            sql_type: NUMERIC(10,2)
            constraints:
              - NOT NULL
              - DEFAULT
          
          - name: shipment_status
            business_name: Shipment Status
            description: Current status of the shipment (e.g., In Transit, Delivered, Delayed).
            sql_type: VARCHAR(20)
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: false
      
      - name: shipment_items
        business_name: Shipment Items
        description: >-
          Shipment line item dataset containing one row per shipment line item (one row per product per shipment).
          Records detailed product-level information within shipments including product references and quantities.
          This is the primary fact table for detailed shipment content analysis.
        source: SHIPMENT_ITEMS
        primary_key:
          - shipment_item_id
        fields:
          - name: shipment_item_id
            business_name: Shipment Item Identifier
            description: Unique identifier for a shipment line item. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: shipment_id
            business_name: Shipment Reference
            description: References the shipment containing the item. Foreign key to shipments.shipment_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: product_id
            business_name: Product Reference
            description: References the product included in the shipment item. Foreign key to products.product_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: quantity
            business_name: Quantity
            description: Number of units of the product in the shipment item.
            sql_type: INT4
            constraints:
              - NOT NULL
      
      - name: campaigns
        business_name: Campaigns
        description: >-
          Marketing campaign master dataset containing one row per marketing campaign. Contains campaign names,
          marketing channels, target customer segments, campaign periods, and discount percentages.
          This is the primary dimension for marketing campaign analysis.
        source: CAMPAIGNS
        primary_key:
          - campaign_id
        fields:
          - name: campaign_id
            business_name: Campaign Identifier
            description: Unique identifier for a marketing campaign. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: campaign_name
            business_name: Campaign Name
            description: Name of the marketing campaign.
            sql_type: VARCHAR(120)
            constraints:
              - NOT NULL
          
          - name: channel
            business_name: Channel
            description: Marketing channel used to run the campaign (e.g., Email, Social Media, TV).
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: target_segment
            business_name: Target Segment
            description: Customer segment targeted by the campaign (e.g., Loyal Customers, New Customers).
            sql_type: VARCHAR(20)
            dimension:
              is_time: false
          
          - name: start_date
            business_name: Start Date
            description: Date when the campaign starts. Use for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: end_date
            business_name: End Date
            description: Date when the campaign ends. Use for campaign period analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: discount_pct
            business_name: Discount Pct
            description: Percentage discount offered by the campaign (e.g., 15.00 means 15% discount).
            sql_type: NUMERIC(5,2)
            constraints:
              - NOT NULL
              - DEFAULT
      
      - name: employees
        business_name: Employees
        description: >-
          Employee master dataset containing one row per employee. Contains employee names, roles, manager references,
          regions, and hire dates. Supports hierarchical management structure through manager_id self-reference.
          Top-level executives have NULL manager_id. Use recursive queries to traverse the management hierarchy.
        source: EMPLOYEES
        primary_key:
          - employee_id
        fields:
          - name: employee_id
            business_name: Employee Identifier
            description: Unique identifier for an employee. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: employee_name
            business_name: Employee Name
            description: Full name of the employee. Contains PII.
            sql_type: VARCHAR(100)
            constraints:
              - NOT NULL
          
          - name: role
            business_name: Role
            description: Job role or position of the employee (e.g., Account Manager, Sales Rep, Director).
            sql_type: VARCHAR(40)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: manager_id
            business_name: Manager Reference
            description: >-
              References the employee who manages this employee. Foreign key to employees.employee_id.
              NULL indicates a top-level executive. Enables hierarchical management analysis.
            sql_type: INT4
            constraints:
              - FK
          
          - name: region
            business_name: Region
            description: Geographic region assigned to the employee. Useful for regional analysis.
            sql_type: VARCHAR(80)
            dimension:
              is_time: false
          
          - name: hire_date
            business_name: Hire Date
            description: Date when the employee was hired. Use for employee tenure analysis.
            sql_type: DATE
            constraints:
              - NOT NULL
              - DEFAULT
            dimension:
              is_time: true
      
      - name: customer_account_managers
        business_name: Customer Account Managers
        description: >-
          Customer account manager assignment dataset implementing SCD Type-2 pattern. Contains one row per
          customer-account manager assignment with temporal validity. Multiple records can exist for the same
          customer_id representing historical assignments. Each record has a validity period defined by
          valid_from and valid_to. valid_to = NULL indicates the current active assignment.
        source: CUSTOMER_ACCOUNT_MANAGERS
        primary_key:
          - assignment_id
        fields:
          - name: assignment_id
            business_name: Assignment Identifier
            description: Unique identifier for a customer account manager assignment. Primary key.
            sql_type: serial
            constraints:
              - PK
              - NOT NULL
              - DEFAULT
              - AUTO_INCREMENT
          
          - name: customer_id
            business_name: Customer Reference
            description: References the related customer record. Foreign key to customers.customer_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: employee_id
            business_name: Employee Reference
            description: References the employee assigned as the account manager. Foreign key to employees.employee_id.
            sql_type: INT4
            constraints:
              - FK
              - NOT NULL
          
          - name: valid_from
            business_name: Valid From
            description: Date when the account manager assignment becomes effective. Start of validity period.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: valid_to
            business_name: Valid To
            description: >-
              Date when the account manager assignment ends. End of validity period.
              NULL indicates the assignment is currently active.
            sql_type: DATE
            dimension:
              is_time: true
      
      - name: exchange_rates
        business_name: Exchange Rates
        description: >-
          Exchange rate reference dataset containing one row per currency per date. Provides currency conversion
          rates against USD for specific dates. Use with as-of date logic to convert order amounts from local
          currency to USD based on the order date.
        source: EXCHANGE_RATES
        primary_key:
          - currency_code
          - rate_date
        fields:
          - name: currency_code
            business_name: Currency Code
            description: ISO currency code for the exchange rate (e.g., EUR, GBP, JPY). Part of composite primary key.
            sql_type: VARCHAR(3)
            constraints:
              - NOT NULL
            dimension:
              is_time: false
          
          - name: rate_date
            business_name: Rate Date
            description: Date for which the exchange rate applies. Part of composite primary key.
            sql_type: DATE
            constraints:
              - NOT NULL
            dimension:
              is_time: true
          
          - name: usd_rate
            business_name: USD Rate
            description: Exchange rate of the currency against USD (e.g., 1.085 means 1 EUR = 1.085 USD).
            sql_type: NUMERIC(12,6)
            constraints:
              - NOT NULL

    relationships:
      - name: orders_to_customers
        left_dataset: orders
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order belongs to exactly one customer.
          Multiple orders can belong to the same customer. Join orders to customers to
          enrich order records with customer attributes such as name, segment, location, and signup date.
      
      - name: orders_to_stores
        left_dataset: orders
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order is fulfilled by exactly one store.
          Multiple orders can be fulfilled by the same store. Join orders to stores to
          enrich order records with store attributes such as store name, location, and store type.
      
      - name: order_items_to_orders
        left_dataset: order_items
        right_dataset: orders
        relationship_type: many_to_one
        join:
          left:
            - order_id
          right:
            - order_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item belongs to exactly one order.
          Multiple order items can belong to the same order. Join order_items to orders to
          enrich order item records with order-level attributes such as order date, customer, store, and channel.
          CRITICAL: Do not sum orders.total_amount_usd or orders.total_cost_usd after this join to avoid double counting.
      
      - name: order_items_to_products
        left_dataset: order_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each order item references exactly one product.
          Multiple order items can reference the same product. Join order_items to products to
          enrich order item records with product attributes such as product name, category, supplier, and pricing.
      
      - name: products_to_product_categories
        left_dataset: products
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product belongs to exactly one category.
          Multiple products can belong to the same category. Join products to product_categories to
          enrich product records with category information and enable category-level analysis.
      
      - name: products_to_suppliers
        left_dataset: products
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each product is provided by exactly one supplier.
          Multiple products can be provided by the same supplier. Join products to suppliers to
          enrich product records with supplier attributes such as supplier name, country, and reliability score.
      
      - name: shipments_to_suppliers
        left_dataset: shipments
        right_dataset: suppliers
        relationship_type: many_to_one
        join:
          left:
            - supplier_id
          right:
            - supplier_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment originates from exactly one supplier.
          Multiple shipments can originate from the same supplier. Join shipments to suppliers to
          enrich shipment records with supplier attributes for supplier performance analysis.
      
      - name: shipments_to_stores
        left_dataset: shipments
        right_dataset: stores
        relationship_type: many_to_one
        join:
          left:
            - store_id
          right:
            - store_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment is destined for exactly one store.
          Multiple shipments can be destined for the same store. Join shipments to stores to
          enrich shipment records with destination store attributes.
      
      - name: shipment_items_to_shipments
        left_dataset: shipment_items
        right_dataset: shipments
        relationship_type: many_to_one
        join:
          left:
            - shipment_id
          right:
            - shipment_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item belongs to exactly one shipment.
          Multiple shipment items can belong to the same shipment. Join shipment_items to shipments to
          enrich shipment item records with shipment-level attributes such as ship date, arrival dates, and freight cost.
      
      - name: shipment_items_to_products
        left_dataset: shipment_items
        right_dataset: products
        relationship_type: many_to_one
        join:
          left:
            - product_id
          right:
            - product_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship. Each shipment item references exactly one product.
          Multiple shipment items can reference the same product. Join shipment_items to products to
          enrich shipment item records with product attributes for shipment content analysis.
      
      - name: product_categories_hierarchy
        left_dataset: product_categories
        right_dataset: product_categories
        relationship_type: many_to_one
        join:
          left:
            - parent_category_id
          right:
            - category_id
        join_type: many_to_one
        resolution: >-
          Hierarchical self-referencing relationship. Each category can have a parent category,
          forming a category hierarchy. Root categories have parent_category_id = NULL.
          Use recursive CTE to traverse the full hierarchy:
          
          WITH RECURSIVE category_hierarchy AS (
            SELECT category_id, category_name, parent_category_id, 1 AS level
            FROM product_categories
            WHERE parent_category_id IS NULL
            UNION ALL
            SELECT c.category_id, c.category_name, c.parent_category_id, ch.level + 1
            FROM product_categories c
            INNER JOIN category_hierarchy ch ON c.parent_category_id = ch.category_id
          )
          SELECT * FROM category_hierarchy;
      
      - name: employees_hierarchy
        left_dataset: employees
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - manager_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Hierarchical self-referencing relationship. Each employee can have a manager,
          forming a management hierarchy. Top-level executives have manager_id = NULL.
          Use recursive CTE to traverse the full hierarchy and calculate organizational metrics:
          
          WITH RECURSIVE employee_hierarchy AS (
            SELECT employee_id, employee_name, manager_id, role, 1 AS level
            FROM employees
            WHERE manager_id IS NULL
            UNION ALL
            SELECT e.employee_id, e.employee_name, e.manager_id, e.role, eh.level + 1
            FROM employees e
            INNER JOIN employee_hierarchy eh ON e.manager_id = eh.employee_id
          )
          SELECT * FROM employee_hierarchy;
      
      - name: customer_account_managers_to_customers
        left_dataset: customer_account_managers
        right_dataset: customers
        relationship_type: many_to_one
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship with SCD Type-2 semantics. Each assignment record
          references exactly one customer. Multiple assignment records can exist for the same customer
          representing historical account manager changes. Join customer_account_managers to customers
          to enrich assignment records with customer attributes.
      
      - name: customer_account_managers_to_employees
        left_dataset: customer_account_managers
        right_dataset: employees
        relationship_type: many_to_one
        join:
          left:
            - employee_id
          right:
            - employee_id
        join_type: many_to_one
        resolution: >-
          Standard foreign key relationship with SCD Type-2 semantics. Each assignment record
          references exactly one employee (the account manager). Multiple assignment records can
          reference the same employee. Join customer_account_managers to employees to enrich
          assignment records with account manager attributes such as name, role, and region.
      
      - name: customers_to_account_managers_scd_type2
        left_dataset: customers
        right_dataset: customer_account_managers
        relationship_type: one_to_many
        join:
          left:
            - customer_id
          right:
            - customer_id
        join_type: scd_type2
        resolution: >-
          SCD Type-2 temporal relationship. Each customer can have multiple account manager assignment
          records representing historical changes. To get the current account manager for a customer:
          
          WHERE cam.customer_id = c.customer_id
          AND cam.valid_to IS NULL
          
          To get the account manager as of a specific date (e.g., order_date):
          
          WHERE cam.customer_id = c.customer_id
          AND cam.valid_from <= <date>
          AND (cam.valid_to IS NULL OR cam.valid_to > <date>)
          
          This enables historical analysis of customer-account manager relationships at any point in time.
      
      - name: orders_to_exchange_rates_asof
        left_dataset: orders
        right_dataset: exchange_rates
        relationship_type: many_to_one
        join:
          left:
            - currency_code
            - order_date
          right:
            - currency_code
            - rate_date
        join_type: as_of
        resolution: >-
          As-of temporal relationship for currency conversion. Each order should be matched to the
          most recent exchange rate available on or before the order date for the order's currency.
          
          Use the following as-of join logic:
          
          WHERE er.currency_code = o.currency_code
          AND er.rate_date = (
            SELECT MAX(rate_date)
            FROM exchange_rates
            WHERE currency_code = o.currency_code
            AND rate_date <= o.order_date::date
          )
          
          This ensures that orders are converted using the exchange rate that was valid at the time
          of the order, enabling accurate historical currency conversion analysis.

    metrics:
      - name: total_revenue
        business_name: Total Revenue
        description: >-
          Total revenue across all orders in USD. Calculated as the sum of total_amount_usd
          at order grain. Use this metric for overall revenue analysis and order-level revenue aggregation.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(orders.total_amount_usd) AS total_revenue
                FROM orders
              columns_used:
                - orders.total_amount_usd
      
      - name: total_cost
        business_name: Total Cost
        description: >-
          Total cost across all orders in USD. Calculated as the sum of total_cost_usd
          at order grain. Use this metric for overall cost analysis and order-level cost aggregation.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(orders.total_cost_usd) AS total_cost
                FROM orders
              columns_used:
                - orders.total_cost_usd
      
      - name: gross_profit
        business_name: Gross Profit
        description: >-
          Total gross profit across all orders in USD. Calculated as total revenue minus total cost
          at order grain. Use this metric for overall profitability analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd) AS gross_profit
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: gross_margin_pct
        business_name: Gross Margin Percentage
        description: >-
          Gross margin percentage across all orders. Calculated as (total revenue - total cost) / total revenue * 100
          at order grain. Uses safe division to handle zero revenue. Use this metric for profitability rate analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  CASE
                    WHEN SUM(orders.total_amount_usd) = 0 THEN 0
                    ELSE (SUM(orders.total_amount_usd) - SUM(orders.total_cost_usd)) 
                         / NULLIF(SUM(orders.total_amount_usd), 0) * 100
                  END AS gross_margin_pct
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.total_cost_usd
      
      - name: order_count
        business_name: Order Count
        description: >-
          Total number of distinct orders. Use this metric for order volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id) AS order_count
                FROM orders
              columns_used:
                - orders.order_id
      
      - name: customer_count
        business_name: Customer Count
        description: >-
          Total number of distinct customers. Use this metric for customer base size analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT customers.customer_id) AS customer_count
                FROM customers
              columns_used:
                - customers.customer_id
      
      - name: average_order_value
        business_name: Average Order Value
        description: >-
          Average order value in USD. Calculated as total revenue divided by number of orders.
          Uses safe division to handle zero orders. Use this metric for order size analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(orders.total_amount_usd) / NULLIF(COUNT(DISTINCT orders.order_id), 0) AS average_order_value
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.order_id
      
      - name: product_revenue
        business_name: Product Revenue
        description: >-
          Total revenue at product grain in USD. Calculated as the sum of line_revenue_usd
          from order_items. Use this metric for product-level revenue analysis. This metric is at
          a finer grain than order-level revenue and should be used when analyzing by product attributes.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_revenue_usd) AS product_revenue
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
      
      - name: product_cost
        business_name: Product Cost
        description: >-
          Total cost at product grain in USD. Calculated as the sum of line_cost_usd
          from order_items. Use this metric for product-level cost analysis.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_cost_usd) AS product_cost
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_cost_usd
      
      - name: product_profit
        business_name: Product Profit
        description: >-
          Total profit at product grain in USD. Calculated as product revenue minus product cost
          using order_items line-level measures. Use this metric for product-level profitability analysis.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_revenue_usd) - SUM(order_items.line_cost_usd) AS product_profit
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.line_cost_usd
      
      - name: units_sold
        business_name: Units Sold
        description: >-
          Total number of product units sold. Calculated as the sum of quantity from order_items.
          Use this metric for volume analysis at product grain.
        return_type: integer
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.quantity) AS units_sold
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.quantity
      
      - name: average_selling_price
        business_name: Average Selling Price
        description: >-
          Average selling price per unit in USD. Calculated as total product revenue divided by
          total units sold. Uses safe division to handle zero quantity. Use this metric for
          pricing analysis at product grain.
        return_type: currency_usd
        result_grain: one row per product
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  order_items.product_id,
                  SUM(order_items.line_revenue_usd) / NULLIF(SUM(order_items.quantity), 0) AS average_selling_price
                FROM order_items
                GROUP BY order_items.product_id
              columns_used:
                - order_items.product_id
                - order_items.line_revenue_usd
                - order_items.quantity
      
      - name: orders_per_customer
        business_name: Orders per Customer
        description: >-
          Average number of orders per customer. Calculated as total order count divided by
          total customer count. Uses safe division to handle zero customers. Use this metric
          for customer engagement analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT orders.order_id)::decimal / 
                  NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS orders_per_customer
                FROM orders
              columns_used:
                - orders.order_id
                - orders.customer_id
      
      - name: revenue_per_customer
        business_name: Revenue per Customer
        description: >-
          Average revenue per customer in USD. Calculated as total revenue divided by
          number of distinct customers who placed orders. Uses safe division to handle zero customers.
          Use this metric for customer value analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(orders.total_amount_usd) / 
                  NULLIF(COUNT(DISTINCT orders.customer_id), 0) AS revenue_per_customer
                FROM orders
              columns_used:
                - orders.total_amount_usd
                - orders.customer_id
      
      - name: shipment_count
        business_name: Shipment Count
        description: >-
          Total number of distinct shipments. Use this metric for shipment volume analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT shipments.shipment_id) AS shipment_count
                FROM shipments
              columns_used:
                - shipments.shipment_id
      
      - name: total_freight_cost
        business_name: Total Freight Cost
        description: >-
          Total freight cost across all shipments in USD. Calculated as the sum of freight_cost_usd.
          Use this metric for logistics cost analysis.
        return_type: currency_usd
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  SUM(shipments.freight_cost_usd) AS total_freight_cost
                FROM shipments
              columns_used:
                - shipments.freight_cost_usd
      
      - name: delayed_shipment_count
        business_name: Delayed Shipment Count
        description: >-
          Number of shipments that arrived later than expected. Calculated by counting shipments
          where actual_arrival > expected_arrival. Use this metric for delivery performance analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT CASE 
                    WHEN shipments.actual_arrival > shipments.expected_arrival 
                    THEN shipments.shipment_id 
                  END) AS delayed_shipment_count
                FROM shipments
                WHERE shipments.actual_arrival IS NOT NULL
                  AND shipments.expected_arrival IS NOT NULL
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: on_time_delivery_pct
        business_name: On-Time Delivery Percentage
        description: >-
          Percentage of shipments that arrived on time or early. Calculated as the count of shipments
          where actual_arrival <= expected_arrival divided by total shipment count with arrival data.
          Uses safe division to handle zero shipments. Use this metric for delivery performance analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT CASE 
                    WHEN shipments.actual_arrival <= shipments.expected_arrival 
                    THEN shipments.shipment_id 
                  END)::decimal / 
                  NULLIF(COUNT(DISTINCT CASE 
                    WHEN shipments.actual_arrival IS NOT NULL 
                      AND shipments.expected_arrival IS NOT NULL 
                    THEN shipments.shipment_id 
                  END), 0) * 100 AS on_time_delivery_pct
                FROM shipments
              columns_used:
                - shipments.shipment_id
                - shipments.actual_arrival
                - shipments.expected_arrival
      
      - name: average_discount_pct
        business_name: Average Discount Percentage
        description: >-
          Average discount percentage across all order items. Calculated as the simple average
          of discount_pct from order_items. Use this metric for discount strategy analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  AVG(order_items.discount_pct) AS average_discount_pct
                FROM order_items
              columns_used:
                - order_items.discount_pct
      
      - name: returned_order_count
        business_name: Returned Order Count
        description: >-
          Number of orders that have been returned. Calculated by counting orders where
          is_returned = true. Use this metric for return rate analysis.
        return_type: integer
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT CASE 
                    WHEN orders.is_returned = true 
                    THEN orders.order_id 
                  END) AS returned_order_count
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: return_rate_pct
        business_name: Return Rate Percentage
        description: >-
          Percentage of orders that have been returned. Calculated as returned order count
          divided by total order count. Uses safe division to handle zero orders.
          Use this metric for return rate analysis.
        return_type: percentage
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  COUNT(DISTINCT CASE 
                    WHEN orders.is_returned = true 
                    THEN orders.order_id 
                  END)::decimal / 
                  NULLIF(COUNT(DISTINCT orders.order_id), 0) * 100 AS return_rate_pct
                FROM orders
              columns_used:
                - orders.order_id
                - orders.is_returned
      
      - name: average_customer_rating
        business_name: Average Customer Rating
        description: >-
          Average customer rating across all orders with ratings. Calculated as the average
          of customer_rating from orders where rating is not null. Use this metric for
          customer satisfaction analysis.
        return_type: decimal
        result_grain: single value
        expression:
          dialects:
            - dialect: POSTGRESQL
              expression: |
                SELECT
                  AVG(orders.customer_rating) AS average_customer_rating
                FROM orders
                WHERE orders.customer_rating IS NOT NULL
              columns_used:
                - orders.customer_rating